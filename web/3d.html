import init,{Web3DSession}from'./pkg/caveat_runtime.js';const c=document.querySelector('#c'),gl=c.getContext('webgl',{antialias:true}),status=document.querySelector('#status'),learned=document.querySelector('#learned'),choices=document.querySelector('#choices');if(!gl)throw Error('WebGL unavailable');const labels={latch_sensor_recently_serviced:['Inspect latch','Check the latch sensor.'],camera_has_blind_spot:['Check camera','Verify camera coverage.'],open:['Push panic bar / open','Open the fire exit and go through.'],wait:['Wait','Observe before deciding.'],stairwell:['Use stairwell','Take the protected stair exit.'],retreat:['Retreat','Move away from this exit.']},learn={latch_sensor_recently_serviced:'The latch sensor was recently serviced.',camera_has_blind_spot:'The camera has a blind spot.',open:'The panic bar releases the latch. The whole leaf swings on its hinges and you move through.',wait:'You wait; uncertainty remains.',stairwell:'You commit to the stairwell.',retreat:'You move away from the exit.'};

let game,world,yaw=0,drag=false,lx=0,seen=0,anims=[],cam=[0,1.7,5],last='';function view(){return mul(ry(yaw*180/Math.PI),tr(-cam[0],-cam[1],-cam[2]))}function obj(id){return world.objects.find(o=>o.id===id)}function events(){for(const e of world.events.slice(seen)){if(e.kind==='rotate_y'){const o=obj(e.object);if(o)anims.push({kind:'rot',o,from:o._ry||0,to:(o._ry||0)+e.degrees,t:0,d:e.duration})}else if(e.kind==='move_to'&&e.object==='player')anims.push({kind:'cam',from:[...cam],to:e.position,t:0,d:e.duration});else if(e.kind==='visible'){const o=obj(e.object);if(o)o.visible=e.visible}}seen=world.events.length}function tick(dt){for(const a of anims){a.t=Math.min(a.d,a.t+dt);const u=1-Math.pow(1-a.t/a.d,3);if(a.kind==='rot')a.o._ry=a.from+(a.to-a.from)*u;else cam=a.from.map((v,i)=>v+(a.to[i]-v)*u)}anims=anims.filter(a=>a.t<a.d)}function box(M,color,glow=0){gl.uniformMatrix4fv(ml,false,M);gl.uniform3fv(cl,color);gl.uniform1f(el,glow);gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_SHORT,0)}function hardware(P,V){const H=node('door_hinge'),part=(x,y,z,sx,sy,sz,col,g=0)=>box(mul(P,mul(V,mul(H,mul(tr(x,y,z),sc(sx/2,sy/2,sz/2))))),col,g);part(1.1,-.12,.13,1.72,.10,.10,[.68,.70,.72]);part(.28,-.12,.14,.20,.28,.13,[.30,.31,.32]);part(1.92,-.12,.14,.20,.28,.13,[.30,.31,.32]);part(1.1,1.12,.12,.72,.12,.10,[.55,.57,.58]);part(.15,1.12,.08,.55,.06,.06,[.45,.46,.47]);for(const y of[-.9,0,.9])part(.03,y,.02,.08,.28,.10,[.42,.43,.44]);part(1.1,.72,.14,.42,.18,.04,[.08,.09,.10]);}
function draw(){tick(.016);const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth*d,h=c.clientHeight*d;if(c.width!==w||c.height!==h){c.width=w;c.height=h}gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.clearColor(.018,.022,.026,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const P=persp(world.camera?.fov||70,w/h,.1,100),V=view();for(const o of world.objects){if(o.visible===false||o.id==='door_hinge'||o.id==='latch')continue;const m=o.material||{color:[.2,.2,.2],emissive:0};box(mul(P,mul(V,node(o.id))),m.color,m.emissive||0)}hardware(P,V);box(mul(P,mul(V,mul(tr(0,3.35,-3.78),sc(.85,.22,.06)))),[.05,.65,.28],.35);requestAnimationFrame(draw)}function refresh(){const n=JSON.parse(game.world()),old=new Map((world?.objects||[]).map(o=>[o.id,o]));for(const o of n.objects){const p=old.get(o.id);if(p&&p._ry)o._ry=p._ry}world=n;events();ui()}function ui(){const p=JSON.parse(game.pending());status.textContent=p.kind==='complete'?'Decision made. Remaining uncertainty is still recorded.':`You have ${p.budget} evidence checks remaining.`;learned.textContent=last?learn[last]:'What do you want to do?';choices.innerHTML='';for(const o of p.options||[]){const [a,d]=labels[o]||[o,''];const x=document.createElement('button');x.innerHTML=`${a}<small>${d}</small>`;x.onclick=()=>{last=o;game.apply(o);refresh()};choices.appendChild(x)}}c.onpointerdown=e=>{drag=true;lx=e.clientX};c.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-lx)*.004;lx=e.clientX};c.onpointerup=()=>drag=false;await init();game=new Web3DSession(await fetch('./the_door_round2.cav').then(r=>r.text()));world=JSON.parse(game.world());events();ui();draw();
