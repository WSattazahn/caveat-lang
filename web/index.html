<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Door — CAVEAT</title><style>body{margin:0;background:#111;color:#eee;font:17px system-ui,-apple-system,sans-serif}.wrap{max-width:640px;margin:auto;padding:28px 20px 60px}h1{font-size:38px;margin:12px 0 4px}.tag{color:#999}.card{margin-top:28px;padding:20px;border:1px solid #444;border-radius:18px;background:#191919}.budget{font-size:14px;color:#bbb;margin-bottom:16px}button{display:block;width:100%;text-align:left;margin:12px 0;padding:17px;border:1px solid #666;border-radius:14px;background:#222;color:#fff;font:inherit}button:active{background:#444}.error{color:#ff9d9d}</style></head><body><main class="wrap"><div class="tag">A game executed by the CAVEAT runtime</div><h1>The Door</h1><p>Emergency lights pulse red. The evacuation corridor is behind a sealed door, and the building systems disagree about whether opening it is safe.</p><section id="game" class="card">Loading CAVEAT…</section></main><script type="module">import init,{WebSession} from './pkg/caveat_runtime.js';const labels={latch_sensor_recently_serviced:'Check the maintenance record for the latch sensor.',camera_has_blind_spot:'Inspect the camera coverage for blind spots.',open:'Open the sealed door.',wait:'Wait for more information.',reroute:'Abandon this corridor and reroute.',continue:'Continue with the earlier plan.',retreat:'Retreat from the corridor.',stairwell:'Take the alternate stairwell.'};const el=document.querySelector('#game');let game;async function boot(){try{await init();const src=await fetch('./the_door_round2.cav').then(r=>{if(!r.ok)throw Error('Could not load CAVEAT world');return r.text()});game=new WebSession(src);render()}catch(e){el.innerHTML='<div class="error">'+e+'</div>'}}function render(){let p;try{p=JSON.parse(game.pending())}catch(e){el.textContent=e;return}if(p.kind==='complete'){el.innerHTML='<h2>Decision record complete</h2><p>'+game.summary()+'</p><button onclick="location.reload()">Play again</button>';return}if(p.kind==='error'){el.innerHTML='<div class="error">'+p.message+'</div>';return}el.innerHTML='<div class="budget">Attention remaining: '+p.budget+(p.kind==='investigate'?' · investigation costs '+p.cost:'')+'</div><h2>'+(p.kind==='investigate'?'What do you investigate?':'What do you do?')+'</h2>';for(const o of p.options){const b=document.createElement('button');b.textContent=labels[o]||o.replaceAll('_',' ');b.onclick=()=>{try{game.apply(o);render()}catch(e){el.innerHTML='<div class="error">'+e+'</div>'}};el.appendChild(b)}}boot();</script></body></html>
