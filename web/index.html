<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Door — CAVEAT</title><style>body{margin:0;background:#111;color:#eee;font:17px system-ui,-apple-system,sans-serif}.wrap{max-width:640px;margin:auto;padding:28px 20px 60px}h1{font-size:38px;margin:12px 0 4px}.tag,.budget{color:#999}.card{margin-top:28px;padding:20px;border:1px solid #444;border-radius:18px;background:#191919}.discovery{border-left:3px solid #ddd;padding:4px 0 4px 16px;margin:16px 0}.discovery strong{display:block;font-size:13px;letter-spacing:.12em;color:#aaa;margin-bottom:7px}button{display:block;width:100%;text-align:left;margin:12px 0;padding:17px;border:1px solid #666;border-radius:14px;background:#222;color:#fff;font:inherit}button:active{background:#444}.error{color:#ff9d9d}</style></head><body><main class="wrap"><div class="tag">A game executed by the CAVEAT runtime</div><h1>The Door</h1><p>Emergency lights pulse red. The evacuation corridor is behind a sealed door, and the building systems disagree about whether opening it is safe.</p><section id="game" class="card">Loading CAVEAT…</section></main><script type="module">import init,{WebSession}from'./pkg/caveat_runtime.js';const L={latch_sensor_recently_serviced:'Check the maintenance record for the latch sensor.',camera_has_blind_spot:'Inspect the camera coverage for blind spots.',maintenance_record:'Maintenance log: the latch sensor failed calibration twice after servicing.',coverage_test:'Camera diagnostic: a blind turn hides the final twelve meters of corridor.',corridor_clear:'the corridor is clear',latch_alarm_reliable:'the latch alarm is reliable',open:'Open the sealed door.',wait:'Wait for more information.',reroute:'Abandon this corridor and reroute.',continue:'Continue with the earlier plan.',retreat:'Retreat from the corridor.',stairwell:'Take the alternate stairwell.'};const label=x=>L[x]||x.replaceAll('_',' '),el=document.querySelector('#game');let game;async function boot(){try{await init();game=new WebSession(await fetch('./the_door_round2.cav').then(r=>r.text()));render()}catch(e){fail(e)}}function fail(e){el.innerHTML='<div class="error">'+e+'</div>'}function render(){let p;try{p=JSON.parse(game.pending())}catch(e){return fail(e)}if(p.kind==='complete'){el.innerHTML='<h2>Decision record complete</h2><p>'+game.summary()+'</p><button onclick="location.reload()">Play again</button>';return}el.innerHTML='<div class="budget">Attention remaining: '+p.budget+(p.kind==='investigate'?' · investigation costs '+p.cost:'')+'</div><h2>'+(p.kind==='investigate'?'What do you investigate?':'What do you do?')+'</h2>';p.options.forEach(o=>{let b=document.createElement('button');b.textContent=label(o);b.onclick=()=>act(o);el.appendChild(b)})}function act(o){try{game.apply(o);let d=JSON.parse(game.discoveries());if(d.length){showDiscovery(d);return}render()}catch(e){fail(e)}}function showDiscovery(ds){el.innerHTML='<h2>You discovered something.</h2>';ds.forEach(d=>{let x=document.createElement('div');x.className='discovery';x.innerHTML='<strong>DISCOVERED</strong>'+label(d.evidence)+'<p>This evidence <b>'+d.relation+'</b> '+label(d.target)+'.</p>';el.appendChild(x)});let b=document.createElement('button');b.textContent='Continue';b.onclick=render;el.appendChild(b)}boot();</script></body></html>
