<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Door — CAVEAT</title><style>body{margin:0;background:#111;color:#eee;font:17px system-ui,-apple-system,sans-serif}.wrap{max-width:640px;margin:auto;padding:28px 20px 60px}h1{font-size:38px;margin:12px 0 4px}.tag,.budget,.muted{color:#999}.card{margin-top:28px;padding:20px;border:1px solid #444;border-radius:18px;background:#191919}.discovery,.commit{border-left:3px solid #ddd;padding:4px 0 4px 16px;margin:16px 0}.reopened{border:1px solid #888;border-radius:12px;padding:14px;margin-top:18px}.kicker{display:block;font-size:13px;letter-spacing:.12em;color:#aaa;margin-bottom:7px}.trail{margin-top:22px;padding-top:16px;border-top:1px solid #333}.trail div{font-size:14px;color:#aaa;margin:8px 0}.trail b{color:#ddd}button{display:block;width:100%;text-align:left;margin:12px 0;padding:17px;border:1px solid #666;border-radius:14px;background:#222;color:#fff;font:inherit}button:active{background:#444}.error{color:#ff9d9d}</style></head><body><main class="wrap"><div class="tag">A game executed by the CAVEAT runtime</div><h1>The Door</h1><p>Emergency lights pulse red. The evacuation corridor is behind a sealed door, and the building systems disagree about whether opening it is safe.</p><section id="game" class="card">Loading CAVEAT…</section><section id="trail" class="trail"><span class="kicker">DECISION TRAIL</span></section></main><script type="module">import init,{WebSession}from'./pkg/caveat_runtime.js';const L={latch_sensor_recently_serviced:'the latch sensor was recently serviced',camera_has_blind_spot:'the camera has a blind spot',maintenance_record:'Maintenance log: the latch sensor failed calibration twice after servicing.',coverage_test:'Camera diagnostic: a blind turn hides the final twelve meters of corridor.',corridor_clear:'the corridor is clear',latch_alarm_reliable:'the latch alarm is reliable',door_unsafe:'the door may be unsafe',open:'Open the sealed door.',wait:'Wait for more information.',reroute:'Abandon this corridor and reroute.',continue:'Continue with the earlier plan.',retreat:'Retreat from the corridor.',stairwell:'Take the alternate stairwell.'};const label=x=>L[x]||x.replaceAll('_',' '),el=document.querySelector('#game'),trail=document.querySelector('#trail');let game,step=0;function log(kind,text){step++;let d=document.createElement('div');d.innerHTML='<b>'+step+'. '+kind+'</b> — '+text;trail.appendChild(d)}async function boot(){try{await init();game=new WebSession(await fetch('./the_door_round2.cav').then(r=>r.text()));render()}catch(e){fail(e)}}function fail(e){el.innerHTML='<div class="error">'+e+'</div>'}function button(text,fn){let b=document.createElement('button');b.textContent=text;b.onclick=fn;el.appendChild(b)}function render(){let p;try{p=JSON.parse(game.pending())}catch(e){return fail(e)}if(p.kind==='complete'){el.innerHTML='<h2>Decision record complete</h2><p class="muted">The trail below records how the decision changed as evidence arrived.</p>';button('Play again',()=>location.reload());return}el.innerHTML='<div class="budget">Attention remaining: '+p.budget+(p.kind==='investigate'?' · investigation costs '+p.cost:'')+'</div><h2>'+(p.kind==='investigate'?'What do you investigate?':'What do you do?')+'</h2>';p.options.forEach(o=>button(label(o),()=>act(o,p.kind)))}function act(o,kind){try{if(kind==='investigate')log('INVESTIGATED',label(o));game.apply(o);let d=JSON.parse(game.discoveries()),c=JSON.parse(game.commitment());if(c){log('COMMITTED',label(c.action));c.retained.forEach(x=>log('RETAINED',label(x)));c.reopened_by.forEach(x=>log('REOPENED','because '+label(x)));showCommit(c);return}if(d.length){d.forEach(x=>log('DISCOVERED',label(x.evidence)+' '+x.relation+' '+label(x.target)));showDiscovery(d);return}render()}catch(e){fail(e)}}function showDiscovery(ds){el.innerHTML='<h2>You discovered something.</h2>';ds.forEach(d=>{let x=document.createElement('div');x.className='discovery';x.innerHTML='<span class="kicker">DISCOVERED</span>'+label(d.evidence)+'<p>This evidence <b>'+d.relation+'</b> '+label(d.target)+'.</p>';el.appendChild(x)});button('Continue',render)}function showCommit(c){el.innerHTML='<span class="kicker">YOU COMMITTED</span><h2>'+label(c.action)+'</h2>';let x=document.createElement('div');x.className='commit';x.innerHTML='<span class="kicker">UNCERTAINTY RETAINED</span><p>You acted without resolving:</p>'+c.retained.map(r=>'<p>• '+label(r)+'</p>').join('');el.appendChild(x);if(c.reopened_by.length){let r=document.createElement('div');r.className='reopened';r.innerHTML='<span class="kicker">COMMITMENT REOPENED</span><b>Your earlier decision is no longer treated as settled.</b><p class="muted">Triggered by: '+c.reopened_by.map(label).join(', ')+'.</p>';el.appendChild(r)}button(c.reopened_by.length?'Reconsider':'Continue',render)}boot();</script></body></html>
