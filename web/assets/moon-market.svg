<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10192a"/><stop offset=".55" stop-color="#202b3d"/><stop offset="1" stop-color="#3b2730"/></linearGradient>
  <linearGradient id="street" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#392d2b"/><stop offset=".5" stop-color="#211d23"/><stop offset="1" stop-color="#15151c"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b4327"/><stop offset=".5" stop-color="#4d2b22"/><stop offset="1" stop-color="#2e1d1c"/></linearGradient>
  <linearGradient id="awning" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b44435"/><stop offset="1" stop-color="#6e2728"/></linearGradient>
  <radialGradient id="lantern"><stop stop-color="#fff3b3"/><stop offset=".2" stop-color="#ffca66"/><stop offset=".58" stop-color="#ed6a39"/><stop offset="1" stop-color="#8d2729"/></radialGradient>
  <radialGradient id="lampGlow"><stop stop-color="#ffd883" stop-opacity=".65"/><stop offset="1" stop-color="#ff9b45" stop-opacity="0"/></radialGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#243f50"/><stop offset="1" stop-color="#122532"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#08070a" flood-opacity=".55"/></filter>
  <pattern id="stones" width="120" height="65" patternUnits="userSpaceOnUse"><path d="M0 30Q28 10 64 28t56 0M-20 61q38-22 74-3t78-2" fill="none" stroke="#6b5550" stroke-width="4" opacity=".22"/></pattern>
</defs>
