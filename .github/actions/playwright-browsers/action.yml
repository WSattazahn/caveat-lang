name: Playwright browsers
description: >
  Install Playwright browsers and their system packages for the installed
  playwright version. Browser downloads and the downloaded system packages
  are cached, so a slow Ubuntu mirror is only paid for once per runner
  image; each install attempt is time-bounded, and a failed or stalled
  install is tried once more before the job fails.
inputs:
  browsers:
    description: Space-separated browser names, as playwright install takes them
    required: true
runs:
  using: composite
  steps:
    - name: Make apt retry stalled downloads, wait for its lock and keep packages
      shell: bash
      run: |
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
          'DPkg::Lock::Timeout "300";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-playwright >/dev/null
    - id: version
      name: Read the installed playwright version
      shell: bash
      run: echo "playwright=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}-${{ inputs.browsers }}
    - uses: actions/cache@v5
      with:
        path: ~/.cache/playwright-apt
        key: playwright-apt-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ steps.version.outputs.playwright }}-${{ inputs.browsers }}
        restore-keys: |
          playwright-apt-${{ env.ImageOS }}-
    - name: Install system packages for ${{ inputs.browsers }}
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # Packages from an earlier run skip the mirror; apt ignores any that are stale.
        if compgen -G "$HOME/.cache/playwright-apt/*.deb" >/dev/null; then
          sudo cp "$HOME"/.cache/playwright-apt/*.deb /var/cache/apt/archives/
        fi
        # Run as root so the time bound can stop apt itself: an unprivileged timeout
        # cannot kill root's apt-get, which then keeps the dpkg lock from the retry.
        # A mirror connection can hang where apt's own timeouts never fire.
        node_bin="$(command -v node)"
        cli="$(dirname "$(node -p "require.resolve('playwright/package.json')")")/cli.js"
        install_deps() {
          sudo timeout --kill-after=30s 8m "$node_bin" "$cli" install-deps $BROWSERS
        }
        if ! install_deps; then
          echo "::warning::playwright install-deps $BROWSERS failed or stalled; trying once more"
          sudo pkill -KILL -x apt-get || true
          sudo dpkg --configure -a
          install_deps
        fi
        mkdir -p "$HOME/.cache/playwright-apt"
        cp /var/cache/apt/archives/*.deb "$HOME/.cache/playwright-apt/" 2>/dev/null || true
    - name: Download ${{ inputs.browsers }}
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # Each attempt is bounded; a stalled download fails here, not at the job limit.
        if ! timeout --kill-after=30s 5m npx playwright install $BROWSERS; then
          echo "::warning::playwright install $BROWSERS failed or stalled; trying once more"
          timeout --kill-after=30s 5m npx playwright install $BROWSERS
        fi
