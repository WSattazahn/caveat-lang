name: Upload artifact, tried twice
description: >
  actions/upload-artifact, tried once more if the first upload fails. The
  upload gives up when blob storage takes no bytes for a while ("Upload
  progress stalled.") and does not retry, so one stalled connection failed
  whole runs (#418, #424) though a second upload went through at once. The
  first attempt here gives up after two minutes without progress instead of
  five; a retry leaves a warning on the run, and an upload that fails twice
  fails the step.
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Files, directories or wildcard patterns to upload, as upload-artifact takes them
    required: true
  if-no-files-found:
    description: warn, error or ignore
    default: warn
  retention-days:
    description: Days to keep the artifact; empty keeps the repository default
    default: ''
  overwrite:
    description: Replace an artifact of the same name in this run
    default: 'false'
  stall-ms:
    description: >
      How long the first attempt waits without upload progress before it gives
      up. The default suits every artifact here; the retry test sets it to 1 to
      force a stall.
    default: '120000'
outputs:
  attempts:
    description: '1 if the first upload went through, 2 if it took the retry'
    value: ${{ steps.second.outcome == 'success' && '2' || '1' }}
runs:
  using: composite
  steps:
    # Each step says !cancelled() so that an upload the caller runs with
    # `if: always()` after a failed step is still made.
    - id: first
      if: '!cancelled()'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      env:
        ACTIONS_ARTIFACT_UPLOAD_TIMEOUT_MS: ${{ inputs.stall-ms }}
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: ${{ inputs.overwrite }}
    - if: "!cancelled() && steps.first.outcome == 'failure'"
      shell: bash
      env:
        ARTIFACT: ${{ inputs.name }}
      run: echo "::warning::upload of artifact '$ARTIFACT' failed; trying once more"
    - id: second
      if: "!cancelled() && steps.first.outcome == 'failure'"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: ${{ inputs.overwrite }}
