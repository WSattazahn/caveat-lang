name: rc7 publication helper recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/releases/rc7-handoff/Publish-Rc7.ps1'
      - 'scripts/test-rc7-publication-helper.ps1'
      - 'scripts/record-rc7-publication.mjs'
      - '.github/workflows/rc7-publication-helper.yml'
  push:
    branches: [main, codex/rc7-publication-recovery]
permissions:
  contents: read
jobs:
  deterministic-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Windows PowerShell 5.1 regression
        shell: powershell
        run: ./scripts/test-rc7-publication-helper.ps1
      - name: PowerShell 7 regression
        shell: pwsh
        run: ./scripts/test-rc7-publication-helper.ps1
  independent-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Verify exact bytes and fresh installed rc7; no publication or GitHub writes
        run: node scripts/record-rc7-publication.mjs --check-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc7-recovery-registry-receipts
          path: test-results/
          retention-days: 90
