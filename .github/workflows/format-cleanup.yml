name: format-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install && rustfmt --version
      - name: Verify canonical Rust formatting
        run: cargo fmt --manifest-path runtime/Cargo.toml --all -- --check
