name: inspect final-main security report paths
on:
  push:
    branches: [codex/verify-rc7-publication-pages]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 11237259670
          run-id: 37030106763
          github-token: ${{ github.token }}
          path: security
      - name: Inspect report identity without changing evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for p in Path('security').rglob('report.json'):
              r=json.loads(p.read_text(encoding='utf-8-sig'))
              print(json.dumps({'path':str(p),'schema':r.get('schema'),'passed':r.get('passed'),'artifact':r.get('artifact'),'failures':r.get('failures')},indent=2))
          PY
