name: rc7 release evidence
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/rc7-release-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  live-release:
    if: github.repository == 'WSattazahn/caveat-lang' && github.event.pull_request.head.ref == 'codex/rc7-release-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_URL: https://wsattazahn.github.io/caveat-lang/
      RELEASE_SHA: 1f3fc7a2208eec964399d6c14232690f411e48be
      BROWSERS: chromium
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1f3fc7a2208eec964399d6c14232690f411e48be
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: browser-dist
          run-id: 36970516513
          github-token: ${{ github.token }}
          path: dist
      - name: Verify exact Runtime and Pages run identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {mkdir, writeFile} from 'node:fs/promises';
          await mkdir('test-results/rc7-live-release', {recursive:true});
          const runs=[];
          for(const [id,event] of [[36970516513,'push'],[36972072386,'workflow_run']]) {
            const r=await fetch(`https://api.github.com/repos/WSattazahn/caveat-lang/actions/runs/${id}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            assert(r.ok,`Run metadata HTTP ${r.status}`);const run=await r.json();
            assert.equal(run.head_sha,process.env.RELEASE_SHA);assert.equal(run.event,event);assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(run.run_attempt,1);
            runs.push({id,head:run.head_sha,event,status:run.status,conclusion:run.conclusion,attempt:run.run_attempt});
          }
          await writeFile('test-results/rc7-live-release/ci-gates.json',JSON.stringify(runs,null,2));
          NODE
      - name: Match live build-info and full/reactive runtime bytes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const local=JSON.parse(await readFile('dist/build-info.json'));
          assert.equal(local.revision,process.env.RELEASE_SHA);assert(local.clean&&local.compiled);assert.equal(local.host,'x86_64-unknown-linux-gnu');
          const r=await fetch(`${process.env.SITE_URL}build-info.json?revision=${process.env.RELEASE_SHA}`);assert(r.ok);const live=await r.json();assert.deepEqual(live,local);
          const checks=[];
          for(const directory of ['pkg','pkg-reactive']) for(const file of await readdir(`dist/${directory}`)) {
            if(!/\.(js|wasm)$/.test(file))continue;
            const name=`${directory}/${file}`;const expected=hash(await readFile(`dist/${name}`));
            const response=await fetch(`${process.env.SITE_URL}${name}?revision=${process.env.RELEASE_SHA}`);assert(response.ok,name);
            const actual=hash(Buffer.from(await response.arrayBuffer()));assert.equal(actual,expected,name);checks.push({name,sha256:actual});
          }
          assert.equal(checks.length,4,'Both full/reactive JS and WASM must be checked');
          await writeFile('test-results/rc7-live-release/runtime-hashes.json',JSON.stringify({revision:process.env.RELEASE_SHA,build:live,checks,observedAt:new Date().toISOString()},null,2));
          NODE
      - run: npx playwright install --with-deps chromium webkit
      - name: Live Last Beacon desktop/mobile routes and source-driven outcomes
        run: npm run test:beacon
      - name: Live Light the Way gameplay and restore/history
        run: npm run test:rescue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc7-live-release-evidence
          path: test-results/
          retention-days: 90

  freeze-github-prerelease:
    needs: live-release
    if: github.repository == 'WSattazahn/caveat-lang' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/rc7-release-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-rc7
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Freeze only the exact reviewed Linux candidate and archive same-byte assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results
          node scripts/release-rc7-candidate.mjs > test-results/rc7-github-freeze.stdout.txt 2> test-results/rc7-github-freeze.stderr.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc7-github-freeze-receipts
          path: |
            test-results/rc7-github-freeze/
            test-results/rc7-github-freeze.stdout.txt
            test-results/rc7-github-freeze.stderr.txt
          if-no-files-found: error
          retention-days: 90
