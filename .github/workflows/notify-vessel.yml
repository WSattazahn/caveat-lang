name: Publish browser runtime and notify Vessel

# Publication runs use tag refs. The later release event covers the interval
# between verified npm publication and creation of its GitHub prerelease.
on:
  workflow_run:
    # workflow_run also observes releases made with GITHUB_TOKEN, whose ordinary
    # release event does not start another workflow.
    workflows: [publish npm, create GitHub prerelease]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Caveat version to backfill
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: caveat-runtime-assets
  cancel-in-progress: false

jobs:
  publish-runtime:
    if: >-
      github.repository == 'WSattazahn/caveat-lang' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'release' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish verified runtime asset and notify Vessel
        env:
          UPSTREAM_TOKEN: ${{ github.token }}
          # Fine-grained token: only WSattazahn/vessel, Contents: write.
          # Optional; hourly reconciliation also discovers public release assets.
          VESSEL_DISPATCH_TOKEN: ${{ secrets.VESSEL_DISPATCH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';

          const upstream = 'WSattazahn/caveat-lang';
          const source = `https://github.com/${upstream}`;
          const apiRoot = `https://api.github.com/repos/${upstream}`;
          const registry = 'https://registry.npmjs.org';
          const summary = text => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${text}\n`);
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          assert.equal(event.repository.full_name, upstream);
          const request = async (url, { method = 'GET', body, token = process.env.UPSTREAM_TOKEN, limit = 32 * 1024 * 1024, allow404 = false, binary = false } = {}) => {
            let current = new URL(url);
            for (let redirects = 0; redirects < 4; redirects++) {
              assert.equal(current.protocol, 'https:');
              assert.ok(!current.username && !current.password && !current.port);
              const isGitHubApi = ['api.github.com', 'uploads.github.com'].includes(current.hostname);
              assert.ok(isGitHubApi || current.hostname === 'registry.npmjs.org' || current.hostname === 'github.com' && current.pathname.startsWith(`/${upstream}/releases/download/`) || current.hostname === 'release-assets.githubusercontent.com' || current.hostname.endsWith('.blob.core.windows.net') || current.hostname.endsWith('.actions.githubusercontent.com'));
              const headers = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
              if (isGitHubApi && token) headers.Authorization = `Bearer ${token}`;
              if (body) headers['Content-Type'] = binary ? 'application/zip' : 'application/json';
              const response = await fetch(current.href, { method, headers, body, redirect: 'manual', signal: AbortSignal.timeout(60000) });
              if (response.status === 302 && method === 'GET') {
                const next = new URL(response.headers.get('location'), current);
                await response.body?.cancel();
                assert.ok(next.hostname === 'release-assets.githubusercontent.com' || next.hostname.endsWith('.blob.core.windows.net') || next.hostname.endsWith('.actions.githubusercontent.com'), 'Unexpected artifact redirect');
                current = next; continue;
              }
              if (allow404 && response.status === 404) return null;
              assert.ok([200, 201, 204].includes(response.status), `Request failed at ${current.hostname}: HTTP ${response.status}`);
              const chunks = []; let size = 0;
              for await (const chunk of response.body ?? []) {
                size += chunk.length; assert.ok(size <= limit, 'Response exceeds size limit'); chunks.push(Buffer.from(chunk));
              }
              return Buffer.concat(chunks);
            }
            throw new Error('Too many redirects');
          };
          const json = async (url, options) => { const value = await request(url, options); return value === null ? null : JSON.parse(value); };
          let tag = event.inputs?.version ? `v${event.inputs.version}` : event.release?.tag_name;
          let notificationWorkflow;
          if (event.workflow_run) {
            const observed = event.workflow_run;
            assert.ok(Number.isSafeInteger(observed.id) && observed.id > 0);
            assert.ok(Number.isSafeInteger(observed.run_attempt) && observed.run_attempt > 0);
            assert.equal(observed.head_repository.full_name, upstream);
            const completed = await json(`${apiRoot}/actions/runs/${observed.id}/attempts/${observed.run_attempt}`);
            assert.equal(completed.repository.full_name, upstream); assert.equal(completed.head_repository.full_name, upstream);
            assert.equal(completed.event, 'workflow_dispatch'); assert.equal(completed.status, 'completed'); assert.equal(completed.conclusion, 'success');
            assert.equal(completed.run_attempt, observed.run_attempt);
            notificationWorkflow = completed.path.split('@')[0];
            assert.ok(['.github/workflows/publish-npm.yml', '.github/workflows/release-prerelease.yml'].includes(notificationWorkflow));
            if (notificationWorkflow === '.github/workflows/release-prerelease.yml') {
              assert.equal(completed.head_branch, 'main');
              const latest = await json(`${registry}/caveat-lang/latest`);
              assert.equal(latest.name, 'caveat-lang'); tag = `v${latest.version}`;
            } else tag = completed.head_branch;
          }
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-rc\.(0|[1-9]\d*))?$/);
          const version = tag.slice(1);
          const assetName = `caveat-browser-runtime-${version}.zip`;
          const release = await json(`${apiRoot}/releases/tags/${tag}`, { allow404: true });
          if (release === null) {
            summary(`Verified npm publication has no GitHub release yet for ${tag}; the release-published event will publish its runtime asset.`);
          } else {
            assert.equal(release.tag_name, tag); assert.equal(release.draft, false);
            assert.ok(Number.isSafeInteger(release.id) && release.id > 0);
            const metadata = await json(`${registry}/caveat-lang/${version}`);
            assert.equal(metadata.name, 'caveat-lang'); assert.equal(metadata.version, version);
            assert.match(metadata.dist.integrity, /^sha512-[A-Za-z0-9+/]{86}==$/);
            assert.equal(metadata.dist.attestations.url, `${registry}/-/npm/v1/attestations/caveat-lang@${version}`);
            const attestations = await json(metadata.dist.attestations.url);
            const statements = attestations.attestations.filter(item => item.predicateType === 'https://slsa.dev/provenance/v1');
            assert.equal(statements.length, 1);
            const statement = JSON.parse(Buffer.from(statements[0].bundle.dsseEnvelope.payload, 'base64'));
            assert.equal(statement.predicateType, 'https://slsa.dev/provenance/v1');
            assert.deepEqual(statement.subject, [{ name: `pkg:npm/caveat-lang@${version}`, digest: { sha512: Buffer.from(metadata.dist.integrity.slice(7), 'base64').toString('hex') } }]);
            const definition = statement.predicate.buildDefinition;
            assert.deepEqual(definition.externalParameters.workflow, { ref: `refs/tags/${tag}`, repository: source, path: '.github/workflows/publish-npm.yml' });
            const dependency = definition.resolvedDependencies.find(item => item.uri === `git+${source}@refs/tags/${tag}`);
            const revision = dependency?.digest.gitCommit;
            assert.match(revision, /^[0-9a-f]{40}$/);
            const invocation = statement.predicate.runDetails.metadata.invocationId;
            assert.ok(invocation.startsWith(`${source}/actions/runs/`));
            const match = /^([0-9]+)\/attempts\/([0-9]+)$/.exec(invocation.slice(`${source}/actions/runs/`.length));
            assert.ok(match);
            const runId = Number(match[1]), attempt = Number(match[2]);
            assert.ok(Number.isSafeInteger(runId) && runId > 0 && Number.isSafeInteger(attempt) && attempt > 0);
            const run = await json(`${apiRoot}/actions/runs/${runId}/attempts/${attempt}`);
            assert.equal(run.repository.full_name, upstream); assert.equal(run.head_repository.full_name, upstream);
            assert.equal(run.path.split('@')[0], '.github/workflows/publish-npm.yml');
            assert.equal(run.event, 'workflow_dispatch'); assert.equal(run.run_attempt, attempt);
            assert.equal(run.status, 'completed'); assert.equal(run.conclusion, 'success');
            assert.equal(run.head_branch, tag); assert.equal(run.head_sha, revision);
            if (notificationWorkflow === '.github/workflows/publish-npm.yml') {
              assert.equal(event.workflow_run.head_repository.full_name, upstream);
              assert.equal(event.workflow_run.id, runId); assert.equal(event.workflow_run.run_attempt, attempt);
            }
            const jobs = await json(`${apiRoot}/actions/runs/${runId}/attempts/${attempt}/jobs?per_page=100`);
            assert.ok(jobs.jobs.some(job => job.name === 'Verify the registry, provenance and a fresh install' && job.status === 'completed' && job.conclusion === 'success'), 'Publication verification must have succeeded');
            const tagRef = await json(`${apiRoot}/git/ref/tags/${tag}`);
            assert.equal(tagRef.object.type, 'tag');
            const annotated = await json(`${apiRoot}/git/tags/${tagRef.object.sha}`);
            assert.equal(annotated.object.type, 'commit'); assert.equal(annotated.object.sha, revision);
            const digestOf = bytes => `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
            const sidecarName = `caveat-browser-runtime-${version}.json`;
            const sidecars = release.assets.filter(item => item.name === sidecarName);
            assert.ok(sidecars.length <= 1, 'Duplicate runtime provenance assets');
            let artifact, runtime, provenance;
            if (sidecars.length) {
              const sidecar = sidecars[0];
              assert.equal(sidecar.state, 'uploaded');
              assert.equal(sidecar.browser_download_url, `${source}/releases/download/${tag}/${sidecarName}`);
              const provenanceBytes = await request(sidecar.browser_download_url, { limit: 1024 * 1024 });
              assert.equal(digestOf(provenanceBytes), sidecar.digest);
              provenance = JSON.parse(provenanceBytes);
              assert.equal(provenance.schema, 'caveat-browser-runtime/1');
              assert.equal(provenance.version, version); assert.equal(provenance.revision, revision);
              assert.equal(provenance.publicationRunId, runId); assert.equal(provenance.publicationRunAttempt, attempt);
              for (const key of ['runtimeRunId', 'runtimeRunAttempt', 'artifactId']) assert.ok(Number.isSafeInteger(provenance[key]) && provenance[key] > 0);
              assert.match(provenance.artifactDigest, /^sha256:[0-9a-f]{64}$/);
              runtime = await json(`${apiRoot}/actions/runs/${provenance.runtimeRunId}/attempts/${provenance.runtimeRunAttempt}`);
              artifact = await json(`${apiRoot}/actions/artifacts/${provenance.artifactId}`, { allow404: true });
              if (artifact) {
                assert.equal(artifact.id, provenance.artifactId);
                assert.equal(artifact.name, 'browser-dist'); assert.equal(artifact.digest, provenance.artifactDigest);
                assert.equal(artifact.workflow_run.id, runtime.id); assert.equal(artifact.workflow_run.head_sha, revision);
              }
            } else {
              const runs = await json(`${apiRoot}/actions/workflows/runtime.yml/runs?event=push&branch=main&status=success&head_sha=${revision}&per_page=100`);
              const candidates = runs.workflow_runs.filter(item => item.repository?.full_name === upstream && item.head_repository?.full_name === upstream && item.path.split('@')[0] === '.github/workflows/runtime.yml' && item.event === 'push' && item.head_branch === 'main' && item.head_sha === revision && item.status === 'completed' && item.conclusion === 'success').sort((a, b) => b.id - a.id);
              for (const candidate of candidates) {
                const listing = await json(`${apiRoot}/actions/runs/${candidate.id}/artifacts?per_page=100`);
                const matches = listing.artifacts.filter(item => item.name === 'browser-dist' && item.expired === false && item.workflow_run?.id === candidate.id && item.workflow_run.head_sha === revision);
                assert.ok(matches.length <= 1);
                if (matches.length) { artifact = matches[0]; runtime = candidate; break; }
              }
              assert.ok(artifact, 'No retained successful Runtime artifact matches the release');
              assert.match(artifact.digest, /^sha256:[0-9a-f]{64}$/);
              assert.ok(Number.isSafeInteger(artifact.id) && artifact.id > 0);
              provenance = { schema: 'caveat-browser-runtime/1', version, revision, runtimeRunId: runtime.id, runtimeRunAttempt: runtime.run_attempt, artifactId: artifact.id, artifactDigest: artifact.digest, publicationRunId: runId, publicationRunAttempt: attempt };
            }
            assert.equal(runtime.id, provenance.runtimeRunId); assert.equal(runtime.run_attempt, provenance.runtimeRunAttempt);
            assert.ok(Number.isSafeInteger(runtime.run_attempt) && runtime.run_attempt > 0);
            assert.equal(runtime.repository.full_name, upstream); assert.equal(runtime.head_repository.full_name, upstream);
            assert.equal(runtime.path.split('@')[0], '.github/workflows/runtime.yml');
            assert.equal(runtime.event, 'push'); assert.equal(runtime.head_branch, 'main'); assert.equal(runtime.head_sha, revision);
            assert.equal(runtime.status, 'completed'); assert.equal(runtime.conclusion, 'success');
            const existing = release.assets.filter(item => item.name === assetName);
            assert.ok(existing.length <= 1, 'Duplicate runtime release assets');
            if (existing.length) {
              assert.equal(existing[0].state, 'uploaded');
              assert.equal(existing[0].digest, provenance.artifactDigest, 'Existing runtime asset differs; replacement is refused');
              summary(`Verified existing immutable runtime asset ${assetName}.`);
            } else {
              const archive = await request(`${apiRoot}/actions/artifacts/${provenance.artifactId}/zip`);
              assert.equal(digestOf(archive), provenance.artifactDigest, 'Actions archive checksum mismatch');
              const uploaded = await json(`https://uploads.github.com/repos/${upstream}/releases/${release.id}/assets?name=${encodeURIComponent(assetName)}`, { method: 'POST', body: archive, binary: true });
              assert.equal(uploaded.name, assetName); assert.equal(uploaded.state, 'uploaded'); assert.equal(uploaded.digest, provenance.artifactDigest);
              summary(`Published ${assetName} from Runtime run ${runtime.id}, artifact ${provenance.artifactId}, ${provenance.artifactDigest}.`);
            }
            if (!sidecars.length) {
              const sidecarBytes = Buffer.from(JSON.stringify(provenance, null, 2) + '\n');
              const uploaded = await json(`https://uploads.github.com/repos/${upstream}/releases/${release.id}/assets?name=${encodeURIComponent(sidecarName)}`, { method: 'POST', body: sidecarBytes });
              assert.equal(uploaded.name, sidecarName); assert.equal(uploaded.state, 'uploaded'); assert.equal(uploaded.digest, digestOf(sidecarBytes));
              summary(`Published permanent Runtime provenance ${sidecarName}.`);
            }
            if (!process.env.VESSEL_DISPATCH_TOKEN) {
              console.log('::warning::VESSEL_DISPATCH_TOKEN is not configured; the public runtime asset is ready. Vessel hourly reconciliation is the fallback.');
              summary('Vessel dispatch skipped: configure VESSEL_DISPATCH_TOKEN for only WSattazahn/vessel with Contents: write. The public release remains available.');
            } else {
              const payload = { event_type: 'caveat-release-published', client_payload: { version, revision, publication_run_id: runId, publication_run_attempt: attempt } };
              await request('https://api.github.com/repos/WSattazahn/vessel/dispatches', { method: 'POST', body: JSON.stringify(payload), token: process.env.VESSEL_DISPATCH_TOKEN });
              summary(`Notified Vessel of verified ${tag} at ${revision}. Vessel verifies the published channel and every artifact independently.`);
            }
          }
          NODE
