  mr-caveat:
    name: Mr. Caveat iPhone QA
    needs: [core, changes]
    if: needs.changes.outputs.games == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: .ci
          sparse-checkout: .github
      - uses: actions/download-artifact@v8
        with:
          name: browser-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - uses: ./.ci/.github/actions/playwright-browsers
        with:
          browsers: webkit
      - name: Play The Missing Dumpling
        run: |
          python3 -m http.server 4176 --directory dist >/tmp/mr-caveat-http.log 2>&1 &
          trap 'kill $! || true' EXIT
          # The page loads only once the server answers.
          for attempt in $(seq 1 50); do curl -sf -o /dev/null http://127.0.0.1:4176/ && break; sleep 0.2; done
          curl -sf -o /dev/null http://127.0.0.1:4176/ || { cat /tmp/mr-caveat-http.log; exit 1; }
          cat > play.cjs <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            try{
              const page=await browser.newPage({...devices['iPhone 13']});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:4176/mr-caveat.html');
              await page.getByRole('button',{name:/Cause a problem/}).waitFor();
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
              if(overflow)throw Error('Mr. Caveat has horizontal overflow');
              await page.screenshot({path:'mr-caveat-00-title.png',fullPage:true});
              await page.getByRole('button',{name:/Cause a problem/}).click();
              const bg=await page.locator('#world').evaluate(el=>getComputedStyle(el).backgroundImage);
              if(!bg.includes('moon-market.svg'))throw Error('Moon Market illustrated scene did not load');
              const npcCount=await page.locator('.npc').count();
              if(npcCount<4)throw Error('Moon Market cast is not rendered as live actors');
              const x0=(await page.evaluate(()=>window.__mrCaveatTest.state())).x;
              await page.keyboard.down('ArrowRight');
              await page.waitForFunction(start=>{
                const state=window.__mrCaveatTest.state();
                return state.x>start+.1&&state.vx>=.15;
              },x0,{timeout:5000});
              await page.evaluate(()=>{
                const samples=window.__mrCaveatInertia=[];
                addEventListener('keyup',function released(event){
                  if(event.key!=='ArrowRight')return;
                  removeEventListener('keyup',released);
                  samples.push(window.__mrCaveatTest.state());
                  function frame(){
                    samples.push(window.__mrCaveatTest.state());
                    if(samples.length<4)requestAnimationFrame(frame);
                  }
                  requestAnimationFrame(frame);
                });
              });
              await page.keyboard.up('ArrowRight');
              await page.waitForFunction(()=>window.__mrCaveatInertia.length===4,null,{timeout:5000});
              const samples=await page.evaluate(()=>window.__mrCaveatInertia);
              for(let i=1;i<samples.length;i++){
                const before=samples[i-1],after=samples[i];
                if(after.x<=before.x||after.vx<=0||after.vx>=before.vx)
                  throw Error('Mr. Caveat must keep moving and decelerate after key release: '+JSON.stringify(samples));
              }
              await page.evaluate(()=>window.__mrCaveatTest.teleport(37));
              await page.evaluate(()=>window.__mrCaveatTest.poke());
              const poked=await page.evaluate(()=>window.__mrCaveatTest.state());
              if(poked.trouble<1)throw Error('Mischief did not create consequences');
              await page.screenshot({path:'mr-caveat-00b-gameplay.png',fullPage:true});
              await page.getByRole('button',{name:/Look closer/}).click();
              await page.getByText(/spicy noodle sauce/i).waitFor();
              await page.getByRole('button',{name:/That complicates things/}).click();
              await page.evaluate(()=>window.__mrCaveatTest.teleport(37));
              await page.getByRole('button',{name:/Accuse Sauce Face/}).click();
              await page.getByText(/Stop following me/i).waitFor();
              await page.getByRole('button',{name:/Run\./}).click();
              await page.locator('#runner.show').waitFor();
              await page.getByRole('button',{name:/DODGE/}).click();
              const runnerState=await page.evaluate(()=>window.__mrCaveatTest.state());
              if(runnerState.runnerLane!==1)throw Error('Runner lane dodge is not interactive');
              await page.getByRole('button',{name:/JUMP/}).click();
              await page.screenshot({path:'mr-caveat-00c-chase.png',fullPage:true});
              await page.evaluate(()=>window.__mrCaveatTest.finishRunner());
              await page.getByRole('button',{name:/Maybe find a better clue/}).click();
              await page.evaluate(()=>window.__mrCaveatTest.teleport(47));
              await page.getByRole('button',{name:/Inspect tiny flour print/}).click();
              await page.getByText(/Tiny pawprint/i).waitFor();
              await page.getByRole('button',{name:/Follow it/}).click();
              await page.evaluate(()=>window.__mrCaveatTest.teleport(91));
              await page.getByRole('button',{name:/check the bridge roof/i}).click();
              await page.getByRole('button',{name:/GO\./}).click();
              await page.locator('#runner.show').waitFor();
              await page.evaluate(()=>window.__mrCaveatTest.finishRunner());
              await page.getByText(/Of course it was the cat/i).waitFor();
              const normalText=(await page.locator('body').innerText()).toLowerCase();
              if(normalText.includes('epistemic')||normalText.includes('commitment reopened'))throw Error('Player-facing CAVEAT jargon leaked into the game');
              await page.screenshot({path:'mr-caveat-01-ending.png',fullPage:true});
              if(errors.length)throw Error(errors.join('\n'));
              console.log('MR CAVEAT PASS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          .ci/.github/ci/retry-once.sh 6 node play.cjs
      - uses: ./.ci/.github/actions/upload-artifact
        if: always()
        with:
          name: mr-caveat-visual-qa
          overwrite: true
          path: mr-caveat-*.png

  moon-garden-2d:
    name: Moon Garden 2D QA
    needs: [core, changes]
    if: needs.changes.outputs.games == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # This job uses little disk; the report rules disk in or out when a
      # step fails without a log.
      - name: Free disk and memory at the start
        run: df -h / && free -m
      - uses: actions/checkout@v5
        with:
          path: .ci
          sparse-checkout: .github
      - uses: actions/download-artifact@v8
        with:
          name: browser-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - uses: ./.ci/.github/actions/playwright-browsers
        with:
          browsers: webkit
      - name: iPhone playthrough
        run: |
          python3 -m http.server 4174 --directory dist >/tmp/moon-http.log 2>&1 &
          trap 'kill $! || true' EXIT
          # The page loads only once the server answers.
          for attempt in $(seq 1 50); do curl -sf -o /dev/null http://127.0.0.1:4174/ && break; sleep 0.2; done
          curl -sf -o /dev/null http://127.0.0.1:4174/ || { cat /tmp/moon-http.log; exit 1; }
          cat > play.cjs <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            try{
              const page=await browser.newPage({...devices['iPhone 13']});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:4174/');
              await page.getByText('Find a useful clue').waitFor();
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1))throw Error('Moon Garden has horizontal overflow');
              await page.screenshot({path:'moon-garden-00-start.png',fullPage:true});
              await page.getByRole('button',{name:/Listen for Miso/}).click();
              await page.getByRole('button',{name:/Keep going/}).click();
              await page.getByRole('button',{name:/Follow the bell/}).click();
              await page.getByText('Commitment reopened',{exact:true}).waitFor();
              await page.getByRole('button',{name:/Revise the plan/}).click();
              await page.getByRole('button',{name:/still-warm cushion/}).click();
              await page.getByRole('button',{name:/Keep going/}).click();
              await page.getByRole('button',{name:/Search behind the tea pavilion/}).click();
              await page.getByRole('button',{name:/See what happens/}).click();
              await page.getByText('There you are.').waitFor();
              await page.waitForFunction(()=>document.querySelector('#miso')?.classList.contains('visible'));
              await page.waitForTimeout(900);
              await page.screenshot({path:'moon-garden-01-ending.png',fullPage:true});
              if(errors.length)throw Error(errors.join('\n'));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          .ci/.github/ci/retry-once.sh 6 node play.cjs
      - uses: ./.ci/.github/actions/upload-artifact
        if: always()
        with:
          name: moon-garden-visual-qa
          overwrite: true
          path: moon-garden-*.png

  moon-garden-3d:
    name: Moon Garden 3D QA
    needs: [core, changes]
    if: needs.changes.outputs.games == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: .ci
          sparse-checkout: .github
      - uses: actions/download-artifact@v8
        with:
          name: browser-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - uses: ./.ci/.github/actions/playwright-browsers
        with:
          browsers: webkit
      - name: iPhone playthrough
        run: |
          python3 -m http.server 4175 --directory dist >/tmp/moon3d-http.log 2>&1 &
          trap 'kill $! || true' EXIT
          # The page loads only once the server answers.
          for attempt in $(seq 1 50); do curl -sf -o /dev/null http://127.0.0.1:4175/ && break; sleep 0.2; done
          curl -sf -o /dev/null http://127.0.0.1:4175/ || { cat /tmp/moon3d-http.log; exit 1; }
          cat > play.cjs <<'NODE'
          const {webkit,devices}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await webkit.launch();
            try{
              const page=await browser.newPage({...devices['iPhone 13']});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:4175/moon-garden-3d.html');
              await page.getByText('Find a useful clue').waitFor();
              await page.waitForFunction(()=>window.__caveat3dIdle?.()===true);
              if(await page.evaluate(()=>window.__caveat3dMode)!=='action_runtime')throw Error('Moon Garden 3D is not using action-runtime execution');
              const canvas=page.locator('#c3d');
              await page.waitForFunction(()=>{const c=document.querySelector('#c3d');return c&&c.width>300&&c.height>250});
              const start=await canvas.screenshot();fs.writeFileSync('moon-garden-3d-00-start.png',start);
              const click=async re=>{const b=page.getByRole('button',{name:re});await b.click();await page.waitForFunction(()=>window.__caveat3dIdle?.()===true)};
              await click(/Listen for Miso/);
              await page.getByRole('button',{name:/Keep going/}).click();
              await click(/Follow the bell/);
              await page.getByText('Commitment reopened',{exact:true}).waitFor();
              await page.getByRole('button',{name:/Revise the plan/}).click();
              await click(/still-warm pavilion cushion/i);
              await page.getByRole('button',{name:/Keep going/}).click();
              await click(/Search behind the tea pavilion/i);
              await page.getByRole('button',{name:/See what happens/}).click();
              await page.getByText('There you are.').waitFor();
              await page.waitForFunction(()=>window.__caveat3dIdle?.()===true);
              const state=await page.evaluate(()=>window.__caveat3dWorldState);
              if(state?.current_place!=='fern_nook')throw Error('Moon Garden 3D did not finish at fern_nook');
              const ending=await canvas.screenshot();fs.writeFileSync('moon-garden-3d-01-ending.png',ending);
              if(Buffer.compare(start,ending)===0)throw Error('Moon Garden 3D did not visibly change');
              if(errors.length)throw Error(errors.join('\n'));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          .ci/.github/ci/retry-once.sh 6 node play.cjs
      - uses: ./.ci/.github/actions/upload-artifact
        if: always()
        with:
          name: moon-garden-3d-visual-qa
          overwrite: true
          path: moon-garden-3d-*.png

  legacy-door:
    name: Legacy Door 3D QA
    needs: [core, changes]
    if: needs.changes.outputs.legacy_door == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: .ci
          sparse-checkout: .github
      - uses: actions/download-artifact@v8
        with:
          name: browser-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - uses: ./.ci/.github/actions/playwright-browsers
        with:
          browsers: webkit
      - name: Every legacy Door route
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/caveat-http.log 2>&1 &
          trap 'kill $! || true' EXIT
          # The page loads only once the server answers.
          for attempt in $(seq 1 50); do curl -sf -o /dev/null http://127.0.0.1:4173/ && break; sleep 0.2; done
          curl -sf -o /dev/null http://127.0.0.1:4173/ || { cat /tmp/caveat-http.log; exit 1; }
          cat > play.cjs <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{const browser=await webkit.launch();try{
            async function waitIdle(p){await p.waitForFunction(()=>window.__caveatIdle?.()===true,null,{timeout:15000})}
            async function fresh(name){const p=await browser.newPage({...devices['iPhone 13']});await p.goto('http://127.0.0.1:4173/3d.html');await p.getByText('Emergency alarm. Leave this floor.').waitFor();const badge=await p.locator('.badge').innerText();if(badge!=='CAVEAT \u00b7 THE DOOR')throw Error('The Door badge text has incorrect encoding: '+JSON.stringify(badge));await waitIdle(p);await p.screenshot({path:`door-${name}-00.png`,fullPage:true});return p}
            async function click(p,re){const b=p.getByRole('button',{name:re});await b.waitFor();await b.click();await waitIdle(p)}
            await (async()=>{const p=await fresh('inspect-latch');await click(p,/Inspect latch/);await p.close()})();
            await (async()=>{const p=await fresh('inspect-camera');await click(p,/Check camera/);await p.close()})();
            for(const route of ['continue','retreat','stairwell']){const p=await fresh(`open-${route}`);await click(p,/Inspect latch/);await click(p,/Push panic bar/);await click(p,new RegExp(route==='continue'?'Continue forward':route==='retreat'?'Retreat':'Use stairwell','i'));await p.screenshot({path:`door-open-${route}-final.png`,fullPage:true});await p.close()}
            {const p=await fresh('wait');await click(p,/Check camera/);await click(p,/Wait/);await p.close()}
            {const p=await fresh('reroute');await click(p,/Check camera/);await click(p,/Reroute/);await p.close()}
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          .ci/.github/ci/retry-once.sh 6 node play.cjs
      - uses: ./.ci/.github/actions/upload-artifact
        if: always()
        with:
          name: caveat-all-route-visual-qa
          overwrite: true
          path: door-*.png

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - name: Highlighting tests with VS Code's tokenizer
        run: npm test --prefix editors/vscode
      - name: Package the .vsix and check what it holds
        run: npm run package --prefix editors/vscode
      - name: Provide a display for VS Code
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Find the oldest supported VS Code
        id: oldest-vscode
        run: |
          echo "version=$(node -p "require('./editors/vscode/package.json').engines.vscode.replace(/^\^/, '')")" >> "$GITHUB_OUTPUT"
      # With the oldest VS Code cached, its check needs no network at all.
      - name: Cache the oldest supported VS Code
        uses: actions/cache@v5
        with:
          path: test-results/vscode-download/vscode-linux-x64-${{ steps.oldest-vscode.outputs.version }}
          key: vscode-linux-x64-${{ steps.oldest-vscode.outputs.version }}
      - name: Install the .vsix in the oldest supported VS Code and compare its tokens
        run: xvfb-run -a npm run test:editor --prefix editors/vscode
      - name: Install the .vsix in current VS Code and compare its tokens
        run: xvfb-run -a npm run test:editor --prefix editors/vscode
        env:
          CAVEAT_VSCODE_VERSION: stable
      - name: Retain the tested .vsix
        uses: ./.github/actions/upload-artifact
        with:
          name: caveat-vscode-extension
          path: |
            test-results/vscode/*.vsix
            test-results/vscode/report.json
            test-results/vscode/SHA256SUMS
            test-results/vscode-editor/*/summary.json
          if-no-files-found: error
          retention-days: 90
