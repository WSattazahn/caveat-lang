name: runtime
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: wasm32-unknown-unknown, components: 'rustfmt, clippy'}
      - uses: actions/cache@v5
        with: {path: ~/.cargo/bin/wasm-bindgen, key: 'wasm-bindgen-cli-0.2.104-${{ runner.os }}'}
      - run: cargo fmt --manifest-path runtime/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path runtime/Cargo.toml --all-targets
      - run: cargo build --manifest-path runtime/Cargo.toml --lib --target wasm32-unknown-unknown --release
      - run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - name: Build browser distribution
        run: |
          rm -rf dist && mkdir -p dist/pkg
          wasm-bindgen runtime/target/wasm32-unknown-unknown/release/caveat_runtime.wasm --out-dir dist/pkg --target web
          cp web/index.html web/graphics.html web/3d.html web/the_door_round2.cav dist/
      - name: CLI and CAVEAT Map playthroughs
        run: |
          printf 'latch_sensor_recently_serviced\nopen\ncontinue\n' | cargo run --manifest-path runtime/Cargo.toml --bin caveat -- --interactive game/the_door_round2.cav
          printf 'camera_has_blind_spot\nopen\nretreat\n' | cargo run --manifest-path runtime/Cargo.toml --bin caveat -- --interactive game/the_door_round2.cav
          printf 'latch_sensor_recently_serviced\nopen\nstairwell\n' | cargo run --manifest-path runtime/Cargo.toml --bin caveat -- --interactive game/the_door_round2.cav
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- validate game/the_door_round2.cav
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- simulate game/the_door_round2.cav camera_has_blind_spot wait
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- simulate game/the_door_round2.cav camera_has_blind_spot reroute
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- simulate game/the_door_round2.cav latch_sensor_recently_serviced open stairwell
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Visual QA — every player-facing route
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/caveat-http.log 2>&1 &
          trap 'kill $! || true' EXIT
          node <<'NODE'
          const {webkit,devices}=require('playwright'),fs=require('fs');
          (async()=>{const browser=await webkit.launch();try{
            async function waitIdle(p){await p.waitForFunction(()=>window.__caveatIdle?.()===true,null,{timeout:15000})}
            async function fresh(name){const p=await browser.newPage({...devices['iPhone 13']});await p.goto('http://127.0.0.1:4173/3d.html');await p.getByText('Emergency alarm. Leave this floor.').waitFor();await waitIdle(p);await p.screenshot({path:`door-${name}-00.png`,fullPage:true});return p}
            async function click(p,re){const b=p.getByRole('button',{name:re});await b.waitFor();await b.click();await waitIdle(p)}
            async function inspect(name,re,text){const p=await fresh(name);await click(p,re);await p.getByText(text).waitFor();await p.screenshot({path:`door-${name}-01.png`,fullPage:true});await p.close()}
            await inspect('inspect-latch',/Inspect latch/,/Evidence: the latch sensor/);
            await inspect('inspect-camera',/Check camera/,/camera coverage has a blind turn/);
            for(const route of ['continue','retreat','stairwell']){const p=await fresh(`open-${route}`);await click(p,/Inspect latch/);await click(p,/Push panic bar/);await p.screenshot({path:`door-open-${route}-01-beyond-a.png`,fullPage:true});await click(p,new RegExp(route==='continue'?'Continue forward':route==='retreat'?'Retreat':'Use stairwell','i'));await p.getByText(new RegExp(route==='continue'?'continue forward':route==='retreat'?'physically return':'reach the landing','i')).waitFor();await p.screenshot({path:`door-open-${route}-02-final.png`,fullPage:true});await p.close()}
            {const p=await fresh('wait');await click(p,/Check camera/);await click(p,/Wait/);await p.getByText(/remain on the original side/i).waitFor();await p.screenshot({path:'door-wait-01.png',fullPage:true});await p.close()}
            {const p=await fresh('reroute');await click(p,/Check camera/);await click(p,/Reroute/);await p.getByText(/physically leave toward the alternate route/i).waitFor();await p.screenshot({path:'door-reroute-01.png',fullPage:true});await p.close()}
            console.log('ALL CAVEAT ROUTES CAPTURED');
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caveat-all-route-visual-qa
          path: door-*.png
