        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find test-results/kit-package -name 'caveat-lang-*.tgz' -type f)
          test "${#tarballs[@]}" -eq 1
          node scripts/release-sbom.mjs --tarball "${tarballs[0]}" --revision HEAD --out test-results/caveat-lang.cdx.json
      - uses: ./.github/actions/upload-artifact
