        run: .github/ci/retry-once.sh 4 npm run test:trail-rescue-page
      - name: Developer kit session library and runner in Chromium
        run: npm run test:kit-browser
      - name: Pack the developer kit and use it from a fresh install
        id: kit_package
        run: npm run test:kit-package
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: kit-package-report
          overwrite: true
          path: test-results/kit-package/*/report.json
      - name: Retain the tested developer kit candidate
        uses: ./.github/actions/upload-artifact
        if: steps.kit_package.outcome == 'success'
        with:
          name: kit-package-candidate
          overwrite: true
          path: |
            test-results/kit-package/*/*.tgz
            test-results/kit-package/*/report.json
            test-results/kit-package/*/build-info.json
            test-results/kit-package/*/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Write the release bill of materials for the tested candidate, as the GitHub release will
        if: steps.kit_package.outcome == 'success'
