  kit-security:
    name: packed kit dependency security
    needs: glowcap-page
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: kit-package-candidate
          path: test-results/security-candidate
      - uses: actions/download-artifact@v8
        with:
          name: browser-dist
          path: dist
      # Building the checker took about 2.5 of this job's 3 minutes. It is the
      # same pinned build every time; the audit still checks its version and
      # records its hash, and the advisories are fetched fresh below. This job
      # runs on every push, because those advisories change from day to day.
      - uses: actions/cache@v5
        with:
          path: test-results/security-tools/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install pinned Rust advisory checker locally
        run: |
          rustup toolchain install
          test -x test-results/security-tools/bin/cargo-audit || cargo install cargo-audit --version 0.22.2 --locked --root test-results/security-tools
      - name: Fetch the current public RustSec advisory database
        run: git clone https://github.com/RustSec/advisory-db.git test-results/security-tools/advisory-db
      - name: Exercise security gate refusal controls
        run: node --test scripts/audit-kit-security.test.mjs scripts/kit-capabilities.test.mjs
      - name: Audit the exact tested package and its build lockfile
        shell: bash
        run: |
          mapfile -t reports < <(find test-results/security-candidate -name report.json -type f)
          test "${#reports[@]}" -eq 1
          node scripts/audit-kit-security.mjs --package-report "${reports[0]}" --audit-bin "$PWD/test-results/security-tools/bin/cargo-audit" --advisory-db "$PWD/test-results/security-tools/advisory-db"
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: kit-security-receipts-${{ github.run_attempt }}
          path: test-results/kit-security/
          if-no-files-found: warn
          retention-days: 90

