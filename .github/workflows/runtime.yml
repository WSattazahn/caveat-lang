        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - name: Play the glowcap explainer
        run: .github/ci/retry-once.sh 4 npm run test:glowcap-page
