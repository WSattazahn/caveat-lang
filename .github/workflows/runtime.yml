  lean-conformance:
    name: Lean runtime comparison
    needs: [core, changes]
    if: ${{ !cancelled() && needs.core.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REUSED: ${{ needs.changes.result == 'success' && needs.changes.outputs.reuse == 'true' && needs.changes.outputs.decided_attempt == github.run_attempt }}
    steps:
      - name: Carry round 1's result
        if: env.REUSED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ROUND1: ${{ needs.changes.outputs.round1_url }}
          TREE: ${{ needs.changes.outputs.round1_tree }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request || ! "$TREE" =~ ^[0-9a-f]{40}$ || "$ROUND1" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"* ]]; then
            echo "::error::Only a pull request run whose regression scope proved the carry may carry round 1's result."
            exit 1
          fi
          echo "::notice title=Carried from round 1::$ROUND1 ran this job to success on tree $TREE. This push only adds lines at the end of the ledger's events, which this job never reads (scripts/ci-reuse/README.md)."
          echo "Not run again: $ROUND1 ran this job to success on tree \`$TREE\`, and this push only adds lines at the end of the ledger's events (scripts/ci-reuse/README.md)." >> "$GITHUB_STEP_SUMMARY"
      - if: env.REUSED != 'true'
        uses: actions/checkout@v5
      - name: Put the ledger's events out of this job's reach
        if: env.REUSED != 'true'
        run: .github/ci/hide-ledger-events.sh
      - if: env.REUSED != 'true'
        uses: actions/download-artifact@v8
        with:
          name: browser-dist
          path: dist
      - if: env.REUSED != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the pinned Rust toolchain
        if: env.REUSED != 'true'
        run: rustup toolchain install && rustc --version
      - name: Install the pinned Lean toolchain
        if: env.REUSED != 'true'
        uses: ./.github/actions/lean-toolchain
      - name: Check fixture and infrastructure failure handling
        if: env.REUSED != 'true'
        run: npm run test:lean-conformance
      - name: Compare proved operations with production runtimes and semantic mutants
        if: env.REUSED != 'true'
        run: npm run verify:lean-conformance
      - name: Compare the runtime with the Caveat Sources model on random histories
        if: env.REUSED != 'true'
        run: npm run verify:lean-sources
      - uses: ./.github/actions/upload-artifact
        if: always() && env.REUSED != 'true'
        with:
          name: lean-runtime-comparison
          path: |
            test-results/lean-conformance/*.json
            test-results/lean-conformance/*.cav
            test-results/lean-conformance/*.rs
            test-results/lean-conformance/*.stdout
            test-results/lean-conformance/*.stderr
            test-results/lean-verification/
            test-results/lean-sources/
          if-no-files-found: error

  # Vessel pins the sha256 of the published WASM. That pin only means something
  # if another Linux machine gets the same bytes, so rebuild from a different
  # checkout path and cargo home and require an exact match.
  reproducible:
    name: reproducible WebAssembly
    needs: [core, changes]
    if: ${{ !cancelled() && needs.core.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      REUSED: ${{ needs.changes.result == 'success' && needs.changes.outputs.reuse == 'true' && needs.changes.outputs.decided_attempt == github.run_attempt }}
    defaults:
      run:
        working-directory: elsewhere/caveat-lang
    steps:
      - name: Carry round 1's result
        if: env.REUSED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ROUND1: ${{ needs.changes.outputs.round1_url }}
          TREE: ${{ needs.changes.outputs.round1_tree }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request || ! "$TREE" =~ ^[0-9a-f]{40}$ || "$ROUND1" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"* ]]; then
            echo "::error::Only a pull request run whose regression scope proved the carry may carry round 1's result."
            exit 1
          fi
          echo "::notice title=Carried from round 1::$ROUND1 ran this job to success on tree $TREE. This push only adds lines at the end of the ledger's events, which this job never reads (scripts/ci-reuse/README.md)."
          echo "Not run again: $ROUND1 ran this job to success on tree \`$TREE\`, and this push only adds lines at the end of the ledger's events (scripts/ci-reuse/README.md)." >> "$GITHUB_STEP_SUMMARY"
      - if: env.REUSED != 'true'
        uses: actions/checkout@v5
        with:
          path: elsewhere/caveat-lang
      - name: Put the ledger's events out of this job's reach
        if: env.REUSED != 'true'
        run: .github/ci/hide-ledger-events.sh
      - if: env.REUSED != 'true'
        uses: actions/download-artifact@v8
        with:
          name: browser-dist
          path: first-build
      - name: Install the toolchain rust-toolchain.toml pins
        if: env.REUSED != 'true'
        run: rustup toolchain install && rustc --version
      - if: env.REUSED != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.104-${{ runner.os }}
      - if: env.REUSED != 'true'
        run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - if: env.REUSED != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: env.REUSED != 'true'
        run: npm ci
      - name: Rebuild with another checkout path and cargo home
        if: env.REUSED != 'true'
        env:
          CARGO_HOME: ${{ runner.temp }}/another cargo home
        run: npm run build
      - name: Require identical bytes
        if: env.REUSED != 'true'
        run: |
          first="$GITHUB_WORKSPACE/first-build"
          for file in pkg/caveat_runtime_bg.wasm pkg/caveat_runtime.js pkg-reactive/caveat_runtime_bg.wasm pkg-reactive/caveat_runtime.js build-info.json; do
            sha256sum "$first/$file" "dist/$file"
            cmp "$first/$file" "dist/$file"
          done
          # Every other file as well. Core semantics built this browser build
          # with the ledger's events in reach, and jobs that can carry round
          # 1's result test it; this rebuild ran with them out of reach, so a
          # file that came to depend on them fails here, in round 1. The
          # artifact leaves out hidden files (.nojekyll), so the comparison
          # leaves out the rebuild's.
          diff -r --exclude='.*' "$first" dist
          if grep -a -q -e "$HOME" -e "$RUNNER_TEMP" "$first/pkg/caveat_runtime_bg.wasm"; then
            echo "::error::the WASM records a builder-specific path"
            exit 1
          fi
          cat dist/build-info.json

  glowcap-page:
    name: Evidence games browser QA
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: browser-dist
          path: dist
