name: runtime

on:
  push:
    branches: [main]
  pull_request:
  # A manual run re-validates a branch, for when GitHub drops a push event.
  # Pages still deploys only from a run started by a push to main.
  workflow_dispatch:

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: regression scope
    runs-on: ubuntu-24.04
    # Reading this pull request's earlier runs needs actions and checks.
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      legacy_door: ${{ steps.scope.outputs.legacy_door }}
      games: ${{ steps.scope.outputs.games }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      round1_url: ${{ steps.reuse.outputs.url }}
      round1_tree: ${{ steps.reuse.outputs.tree }}
      round1_finished: ${{ steps.reuse.outputs.finished }}
      carried_names: ${{ steps.reuse.outputs.names }}
      decided_attempt: ${{ steps.reuse.outputs.attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Decide whether The Door needs visual regression
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            legacy=true
          else
            files="$(git diff --name-only "$base" "$head")"
            # A file name is printed as text, never read as a workflow
            # command such as the tested-tree record the round-1 carry reads.
            stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::$stop"
            printf '%s\n' "$files"
            echo "::$stop::"
            if printf '%s\n' "$files" | grep -Eq '^(runtime/|game/the_door_round2\.cav$|web/3d\.html$|web/the_door_round2\.cav$)'; then
              legacy=true
            else
              legacy=false
            fi
          fi

          echo "legacy_door=$legacy" >> "$GITHUB_OUTPUT"
          echo "Legacy Door visual regression required: $legacy"

          # Game browser QA is skipped only for a pull request that changes
          # nothing but docs/ and top-level Markdown; pushes always run it.
          games=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$base" && ! "$base" =~ ^0+$ ]]; then
            if [[ -n "$files" ]] && ! grep -Evq '^(docs/.*|[^/]+\.md)$' <<< "$files"; then
              games=false
            fi
          fi
          echo "games=$games" >> "$GITHUB_OUTPUT"
          echo "Game browser QA required: $games"
      # The round-1 carry (scripts/ci-reuse/README.md). Every pull request run
      # leaves the tree it tests. When a push only adds lines at the end of the
      # ledger's events and round 1 ran green on the same tree, the jobs that
      # never read those events carry round 1's result instead of running
      # again. Any doubt or error runs everything; a push to main, a manual
      # run and a pull request from a fork never carry. The jobs carry only in
      # the attempt that decided, so a re-run of failed jobs, which keeps
      # this job's outputs, runs them in full.
      - id: reuse
        name: Record the tested tree and decide whether round 1's result carries over
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GAMES: ${{ steps.scope.outputs.games }}
          LEGACY_DOOR: ${{ steps.scope.outputs.legacy_door }}
          ROUND1_REUSE: ${{ vars.ROUND1_REUSE }}
        run: node scripts/ci-reuse/reuse.mjs

  # Runs only when this run carries round 1's result: its success names the
  # round-1 run and the jobs carried, so the PR ledger and the done check
  # record the carry along with the merge that rests on it.
  round1-carry:
    name: round-1 carry
    needs: changes
    if: needs.changes.outputs.reuse == 'true' && needs.changes.outputs.decided_attempt == github.run_attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Name the round-1 run whose result this run carries
        shell: bash
        env:
          ROUND1: ${{ needs.changes.outputs.round1_url }}
          TREE: ${{ needs.changes.outputs.round1_tree }}
          FINISHED: ${{ needs.changes.outputs.round1_finished }}
          CARRIED: ${{ needs.changes.outputs.carried_names }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request || ! "$TREE" =~ ^[0-9a-f]{40}$ || "$ROUND1" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"* ]]; then
            echo "::error::Only a pull request run whose regression scope proved the carry may carry round 1's result."
            exit 1
          fi
          echo "::notice title=Round-1 carry::$ROUND1 (finished $FINISHED) ran these jobs to success on tree $TREE: $CARRIED. This push only adds lines at the end of the ledger's events, which they never read. Core semantics replays the new events here, and the run on main runs every job again."
          {
            echo "### Carried from round 1"
            echo
            echo "$ROUND1 (finished $FINISHED) ran these jobs to success on tree \`$TREE\`: $CARRIED."
            echo
            echo "This push only adds lines at the end of the ledger's events, which they never read (scripts/ci-reuse/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  core:
    name: core semantics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install && rustc --version
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.104-${{ runner.os }}
      - name: Third-party notices match the locked crates
        run: node scripts/third-party-notices.mjs --check
      - name: Pages deployment gate refuses untested or stale artifacts
        run: node --test scripts/pages-gate.test.mjs
      - name: Game QA retry count opens an issue only past its threshold
        run: node --test scripts/game-qa-retries.test.mjs
      - name: Stabilization trial reruns a stalled trial but fails a real slowdown
        run: node --test experiments/stabilization-trial/run.test.mjs
      - name: Release bill of materials covers every compiled-in crate and refuses gaps
        run: node --test scripts/release-sbom.test.mjs
      - name: Distribution closeout check refuses unexplained channel or registry mismatches
        run: node --test scripts/check-distribution.test.mjs
      - run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build browser distribution
        run: npm run build
      - name: npm publication gate refuses untested, mismatched or unattested packages, deciding in Caveat as the legacy checks did
        run: npm run test:release-gate
      - name: The release gate runs on the released kit publish-npm pins
        shell: bash
        run: |
          eval "$(node scripts/release-gate/pin.mjs --shell)"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gate-kit.tgz" "$GATE_KIT_TARBALL"
          echo "$GATE_KIT_SHA256  $RUNNER_TEMP/gate-kit.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gate-kit" && tar -xzf "$RUNNER_TEMP/gate-kit.tgz" -C "$RUNNER_TEMP/gate-kit"
          CAVEAT_GATE_KIT="$RUNNER_TEMP/gate-kit/package" node --test scripts/release-publish.test.mjs scripts/release-gate/release-gate.test.mjs
      - name: Slime glow WebAssembly policy checks
        run: npm run test:slime-glow
      - name: Elapsed clock WebAssembly checks
        run: npm run test:elapsed-clock
      - name: Structured dispatch WebAssembly checks
        run: npm run test:dispatch-outcomes
      - name: Program interfaces, native against both WebAssembly builds
        run: npm run test:interface
      - name: Glowcap explanations against the lean runtime
        run: npm run test:glowcap
      - name: Trail Rescue registered scenarios, invariants and restore
        run: npm run test:trail-rescue
      - name: Before the Rain scenarios
        run: npm run test:before-the-rain
      - name: Caveatist canon loads, checks clean and passes its scenarios
        run: npm run test:caveatism
      - name: Lean bridge example checks clean and passes its scenarios
        run: npm run test:lean-bridge
      - name: Try to break this page checker, its examples and mutation controls
        run: npm run test:break
      - name: Installable Caveatist skill copy and plugin metadata
        run: |
          cmp caveatism/skills/caveatist/SKILL.md skills/caveatist/SKILL.md
          cmp caveatism/skills/caveatist/SKILL.md plugins/caveat/skills/caveatist/SKILL.md
          node -e 'for (const f of ["plugins/caveat/.claude-plugin/plugin.json", "plugins/caveat/.codex-plugin/plugin.json", "plugins/caveat/.codex-plugin/mcp.json", ".claude-plugin/marketplace.json", "server.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'
          node -e 'const c = JSON.parse(require("fs").readFileSync("plugins/caveat/.codex-plugin/plugin.json", "utf8")).interface.capabilities; if (!Array.isArray(c) || !c.every(x => typeof x === "string")) throw new Error("plugins/caveat/.codex-plugin/plugin.json: interface.capabilities must be a list of strings")'
      - name: TypeScript formatter compatibility
        run: >-
          npm exec --yes --package=typescript@5.9.3 -- tsc
          --noEmit --strict --module nodenext --target es2022
          --lib ES2022,ESNext.Disposable,DOM kit/type-tests/dependents-format.mts
      - name: Generated program declarations compile
        run: >-
          npm exec --yes --package=typescript@5.9.3 -- tsc
          --noEmit --strict --module nodenext --target es2022
          --lib ES2022,ESNext.Disposable,DOM kit/type-tests/program-types.mts
      - name: Developer kit session library and scenario runner
        run: npm run test:kit
      - name: The project's own decision ledger replays and its scenarios pass
        run: npm run test:ledger
      - name: The pull request done check decides in Caveat
        run: npm run test:done-check
      - name: The PR ledger Action's host keeps its record in Caveat
        run: npm run test:pr-ledger
      - name: The round-1 carry refuses every unproven case and skips only the jobs it names
        run: npm run test:ci-reuse
      - name: The review shortlist lists what rests on an agent's word alone
        run: npm run test:review-shortlist
      - name: The agent undo-list tutorial runs as written
        run: npm run test:tutorial
      - name: Adoption scorer mutation controls (no trial agents)
        run: node --test experiments/agent-adoption/v1/checks.test.mjs
      - name: Adoption runner capture failure controls (no trial agents)
        run: python3 -B experiments/agent-adoption/v1/runner-capture.test.py
      - name: Converted Trail Rescue and Glowcap scenarios
        run: npm run test:scenario-conversion
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: slime-glow-wasm-report
          overwrite: true
          path: test-results/slime-glow-wasm.json
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: trail-rescue-policy-report
          overwrite: true
          path: test-results/trail-rescue.json
      - uses: ./.github/actions/upload-artifact
        with:
          name: browser-dist
          overwrite: true
          path: dist
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 90 || 7 }}

  # The native runtime checks need no browser build, and nothing downstream
  # waits on them, so they run beside core instead of ahead of it.
  hosted-mcp:
    name: hosted MCP server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix hosted-mcp
      - name: HTTP answers match the published stdio server, in Node and in local workerd
        run: npm test --prefix hosted-mcp
      - name: Worker bundles within the free plan's 3 MB compressed limit
        working-directory: hosted-mcp
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run | tee dry-run.txt
          node -e 'const m = /gzip: ([0-9.]+) KiB/.exec(require("fs").readFileSync("dry-run.txt", "utf8")); if (!m || Number(m[1]) > 3072) throw new Error("bundle over 3 MB compressed: " + (m && m[1]))'
      - name: Codex plugin connects the server this Worker deploys
        run: node -e 'const fs = require("fs"); const name = /^name = "(.+)"/m.exec(fs.readFileSync("hosted-mcp/wrangler.toml", "utf8"))[1]; const url = JSON.parse(fs.readFileSync("plugins/caveat/.codex-plugin/mcp.json", "utf8")).mcpServers["caveat-lang"].url; if (url !== `https://${name}.waltersattazahn.workers.dev/mcp`) throw new Error(url)'

  # The native checks run as three jobs side by side. Each runs the same
  # commands it ran when they were one job; they share no build, so each
  # compiles what it tests. As one job the two debug test suites ran one after
  # the other, about 14 minutes each, and made the whole run about 34 minutes.
  #
  # The jobs from here to light-the-way that say REUSED can carry round 1's
  # result (scripts/ci-reuse/README.md): each step but the first is skipped
  # when the regression scope proved that this push only adds lines at the
  # end of the ledger's events, which these jobs never read, and round 1 ran
  # them to success on the same tree. Each full run puts those events out of
  # its reach (.github/ci/hide-ledger-events.sh): reading the file fails, and
  # git gives a placeholder line for it. Four of them use the browser build
  # core makes with the events in reach; the reproducible job requires every
  # file of it to match its own rebuild without them. They carry only in the
  # attempt that decided: a re-run of failed jobs keeps the regression
  # scope's outputs, and runs them in full. A failed regression scope runs
  # native, native-reactive, compatibility, lean-conformance and reproducible
  # in full; last-beacon and light-the-way need its games output and are
  # skipped then, as they were before the carry.
  native:
    name: native runtime
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Line tables keep panic locations and backtraces while cutting a clean
    # debug test build from about 17 GB to 7 GB, and do not change generated
    # code or stack use. The disk and memory reports are there because a run
    # on #417 died without a log; a runner showed 69 GB still free after this
    # job, so a full disk is not a likely cause.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      REUSED: ${{ needs.changes.result == 'success' && needs.changes.outputs.reuse == 'true' && needs.changes.outputs.decided_attempt == github.run_attempt }}
    steps:
      - name: Carry round 1's result
        if: env.REUSED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ROUND1: ${{ needs.changes.outputs.round1_url }}
          TREE: ${{ needs.changes.outputs.round1_tree }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request || ! "$TREE" =~ ^[0-9a-f]{40}$ || "$ROUND1" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"* ]]; then
            echo "::error::Only a pull request run whose regression scope proved the carry may carry round 1's result."
            exit 1
          fi
          echo "::notice title=Carried from round 1::$ROUND1 ran this job to success on tree $TREE. This push only adds lines at the end of the ledger's events, which this job never reads (scripts/ci-reuse/README.md)."
          echo "Not run again: $ROUND1 ran this job to success on tree \`$TREE\`, and this push only adds lines at the end of the ledger's events (scripts/ci-reuse/README.md)." >> "$GITHUB_STEP_SUMMARY"
      - name: Free disk and memory before the build
        if: env.REUSED != 'true'
        run: df -h / && free -m
      - if: env.REUSED != 'true'
        uses: actions/checkout@v5
      - name: Put the ledger's events out of this job's reach
        if: env.REUSED != 'true'
        run: .github/ci/hide-ledger-events.sh
      - name: Install the toolchain rust-toolchain.toml pins
        if: env.REUSED != 'true'
        run: rustup toolchain install && rustc --version
      - if: env.REUSED != 'true'
        run: cargo fmt --manifest-path runtime/Cargo.toml --all -- --check
      - if: env.REUSED != 'true'
        run: cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
      # nextest runs the same tests as cargo test --all-targets, each in its own
      # process, up to one per CPU at a time; cargo test ran the ~190 test
      # files one after another. On a 4-CPU machine the reactive-only suite
      # took 319 s instead of 1,021 s, all 1,583 tests passing both ways.
      # The maximum supported call depth needs more stack in unoptimized tests.
      # Keep the optimized runtime independently checked with the default stack
      # (native-optimized below).
      - if: env.REUSED != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-0.9.151-${{ runner.os }}
      - if: env.REUSED != 'true'
        run: command -v cargo-nextest >/dev/null || cargo install cargo-nextest --version 0.9.151 --locked
      - if: env.REUSED != 'true'
        run: cargo nextest run --manifest-path runtime/Cargo.toml --all-targets
        env:
          RUST_MIN_STACK: 16777216
      - name: CLI and CAVEAT Map playthroughs
        if: env.REUSED != 'true'
        run: |
          printf 'latch_sensor_recently_serviced\nopen\ncontinue\n' | cargo run --manifest-path runtime/Cargo.toml --bin caveat -- --interactive game/the_door_round2.cav
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- validate game/the_door_round2.cav
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- validate game/moon_garden.cav
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- validate game/missing_dumpling.cav
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- simulate game/missing_dumpling.cav sauce_might_be_noodles follow_sauce_face tiny_print_could_be_shop_cat search_bridge
          cargo run --manifest-path runtime/Cargo.toml --bin caveat-map -- simulate game/moon_garden.cav bell_echo_distorts_direction follow_bell cushion_may_hold_old_fur search_tea_pavilion
      - name: Free disk and memory after the build
        if: always() && env.REUSED != 'true'
        run: df -h / && free -m && du -sh runtime/target

  native-reactive:
    name: native runtime, reactive-only and diagnostic features
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      REUSED: ${{ needs.changes.result == 'success' && needs.changes.outputs.reuse == 'true' && needs.changes.outputs.decided_attempt == github.run_attempt }}
    steps:
      - name: Carry round 1's result
        if: env.REUSED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ROUND1: ${{ needs.changes.outputs.round1_url }}
          TREE: ${{ needs.changes.outputs.round1_tree }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request || ! "$TREE" =~ ^[0-9a-f]{40}$ || "$ROUND1" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"* ]]; then
            echo "::error::Only a pull request run whose regression scope proved the carry may carry round 1's result."
            exit 1
          fi
          echo "::notice title=Carried from round 1::$ROUND1 ran this job to success on tree $TREE. This push only adds lines at the end of the ledger's events, which this job never reads (scripts/ci-reuse/README.md)."
          echo "Not run again: $ROUND1 ran this job to success on tree \`$TREE\`, and this push only adds lines at the end of the ledger's events (scripts/ci-reuse/README.md)." >> "$GITHUB_STEP_SUMMARY"
      - name: Free disk and memory before the build
        if: env.REUSED != 'true'
        run: df -h / && free -m
      - if: env.REUSED != 'true'
        uses: actions/checkout@v5
      - name: Put the ledger's events out of this job's reach
        if: env.REUSED != 'true'
        run: .github/ci/hide-ledger-events.sh
      - name: Install the toolchain rust-toolchain.toml pins
        if: env.REUSED != 'true'
        run: rustup toolchain install && rustc --version
      - name: Lint the reactive-only runtime
        if: env.REUSED != 'true'
        run: cargo clippy --manifest-path runtime/Cargo.toml --all-targets --no-default-features -- -D warnings
      - if: env.REUSED != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-0.9.151-${{ runner.os }}
      - if: env.REUSED != 'true'
        run: command -v cargo-nextest >/dev/null || cargo install cargo-nextest --version 0.9.151 --locked
      - name: Test the reactive-only runtime
        if: env.REUSED != 'true'
        run: cargo nextest run --manifest-path runtime/Cargo.toml --all-targets --no-default-features
        env:
          RUST_MIN_STACK: 16777216
      - name: Withdrawal collector diagnostics and paired retention cases
        if: env.REUSED != 'true'
        run: cargo test --locked --manifest-path runtime/Cargo.toml --no-default-features --features collector-metrics --test withdrawal_collection --test collector_index_compaction --test withdrawal_batch_extraction
        env:
          RUST_MIN_STACK: 16777216
      - name: Native withdrawal-extraction diagnostic recorder
        if: env.REUSED != 'true'
        run: cargo test --locked --manifest-path runtime/Cargo.toml --no-default-features --features withdrawal-extraction-profile --lib withdrawal_profile
      - name: Native renewal-removal diagnostic recorder
        if: env.REUSED != 'true'
        run: cargo test --locked --manifest-path runtime/Cargo.toml --no-default-features --features renewal-removal-profile --lib renewal_profile
      - name: Native event-phase diagnostic recorder
        if: env.REUSED != 'true'
        run: cargo test --locked --manifest-path runtime/Cargo.toml --no-default-features --features event-phase-profile --lib event_profile
      - name: Native event-phase allocation-origin mode
        if: env.REUSED != 'true'
        run: cargo test --locked --manifest-path runtime/Cargo.toml --no-default-features --features event-phase-origins --lib event_profile
      - name: Free disk and memory after the build
        if: always() && env.REUSED != 'true'
        run: df -h / && free -m && du -sh runtime/target

  native-optimized:
    name: native runtime, optimized builds
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Free disk and memory before the build
        run: df -h / && free -m
      - uses: actions/checkout@v5
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install && rustc --version
      - name: Maximum supported call depth on the optimized default stack
        run: cargo test --release --manifest-path runtime/Cargo.toml --test dispatch_outcomes the_maximum_valid_procedure_depth_still_dispatches -- --exact
      - name: Withdrawal collector at the real storage capacity
        run: cargo test --release --locked --manifest-path runtime/Cargo.toml --no-default-features --features collector-metrics --test withdrawal_capacity -- --ignored --nocapture
      - name: Free disk and memory after the build
        if: always()
        run: df -h / && free -m && du -sh runtime/target

  # The rc.15 compatibility and departure gates build their own browser
  # distribution so they can run beside core; core's browser-dist stays the
  # one artifact the browser jobs and Pages use.
  compatibility:
    name: rc.15 compatibility and departure gates
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      REUSED: ${{ needs.changes.result == 'success' && needs.changes.outputs.reuse == 'true' && needs.changes.outputs.decided_attempt == github.run_attempt }}
    steps:
      - name: Carry round 1's result
        if: env.REUSED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ROUND1: ${{ needs.changes.outputs.round1_url }}
          TREE: ${{ needs.changes.outputs.round1_tree }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request || ! "$TREE" =~ ^[0-9a-f]{40}$ || "$ROUND1" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"* ]]; then
            echo "::error::Only a pull request run whose regression scope proved the carry may carry round 1's result."
            exit 1
          fi
          echo "::notice title=Carried from round 1::$ROUND1 ran this job to success on tree $TREE. This push only adds lines at the end of the ledger's events, which this job never reads (scripts/ci-reuse/README.md)."
          echo "Not run again: $ROUND1 ran this job to success on tree \`$TREE\`, and this push only adds lines at the end of the ledger's events (scripts/ci-reuse/README.md)." >> "$GITHUB_STEP_SUMMARY"
      - if: env.REUSED != 'true'
        uses: actions/checkout@v5
      - name: Put the ledger's events out of this job's reach
        if: env.REUSED != 'true'
        run: .github/ci/hide-ledger-events.sh
      - name: Install the toolchain rust-toolchain.toml pins
        if: env.REUSED != 'true'
        run: rustup toolchain install && rustc --version
      - if: env.REUSED != 'true'
