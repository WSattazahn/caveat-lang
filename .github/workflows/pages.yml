name: deploy-pages

on:
  workflow_run:
    workflows: [runtime]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: Select tested main artifact
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      runtime_run_id: ${{ steps.select.outputs.runtime_run_id }}
      runtime_run_attempt: ${{ steps.select.outputs.runtime_run_attempt }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      legacy_door: ${{ steps.select.outputs.legacy_door }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Require successful runtime CI for current main
        id: select
        run: node scripts/pages-gate.mjs select
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Prepare the tested Pages artifact
    needs: candidate
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact_name: ${{ steps.pages_name.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Download the exact distribution tested by runtime CI
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          run-id: ${{ needs.candidate.outputs.runtime_run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Verify source revision, Linux provenance and legal files
        run: node scripts/pages-gate.mjs verify-build
        env:
          PAGE_SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
      # The bytes a host pins. Pages keeps only the latest build, so this is
      # where an older revision's runtime can still be fetched from.
      - name: Keep the published runtime for host pinning
        uses: actions/upload-artifact@v7
        with:
          name: caveat-runtime-${{ needs.candidate.outputs.source_sha }}
          path: |
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/build-info.json
            dist/slime_glow_ability.cav
            dist/slime-glow-policy.js
            dist/pkg/caveat_runtime.js
            dist/pkg/caveat_runtime_bg.wasm
            dist/pkg-reactive/caveat_runtime.js
            dist/pkg-reactive/caveat_runtime_bg.wasm
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      - name: Name the Pages artifact for this build attempt
        id: pages_name
        run: echo "artifact_name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: ${{ steps.pages_name.outputs.artifact_name }}

  deploy:
    needs: [candidate, build]
    runs-on: ubuntu-24.04
    # Ineligible runtime completions cannot cancel a valid deployment. Recheck
    # main after acquiring this lock so an older queued build cannot roll back.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - uses: actions/configure-pages@v6
      - name: Refuse a superseded revision or runtime result
        run: node scripts/pages-gate.mjs recheck
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGE_SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
          PAGE_RUNTIME_RUN_ID: ${{ needs.candidate.outputs.runtime_run_id }}
          PAGE_RUNTIME_RUN_ATTEMPT: ${{ needs.candidate.outputs.runtime_run_attempt }}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}

  evidence-games:
    name: live evidence games QA
    needs: [candidate, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
      PAGE_SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require the live build to name the tested source
        run: |
          node --input-type=module <<'NODE'
          import { validateBuildInfo } from './scripts/pages-gate.mjs';
          const base = process.env.SITE_URL.replace(/\/?$/, '/');
          const response = await fetch(new URL(`build-info.json?revision=${process.env.PAGE_SOURCE_SHA}`, base));
          if (!response.ok) throw new Error(`Live build-info HTTP ${response.status}`);
          validateBuildInfo(await response.json(), process.env.PAGE_SOURCE_SHA);
          NODE
      - name: Play live Glowcap on desktop and mobile
        run: npm run test:glowcap-page
      - name: Play live Trail Rescue on desktop and mobile
        run: npm run test:trail-rescue-page
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-games-live-visuals
          path: |
            test-results/glowcap-*.png
            test-results/trail-rescue-*.png

  visual-mr-caveat:
    name: live Mr. Caveat QA
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock playwright@1.55.0 pngjs@7
      - run: npx playwright install --with-deps webkit
      - name: Play live Missing Dumpling
        run: |
          node <<'NODE'
          const {webkit,devices}=require('playwright');
          const {PNG}=require('pngjs');
          const fs=require('fs');
          const variance=b=>{const p=PNG.sync.read(b);let s=0,s2=0,n=p.width*p.height;for(let i=0;i<p.data.length;i+=4){const v=(p.data[i]+p.data[i+1]+p.data[i+2])/3;s+=v;s2+=v*v}return s2/n-(s/n)**2};
          (async()=>{
            const browser=await webkit.launch();
            try{
              const page=await browser.newPage({...devices['iPhone 13']});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const base=process.env.SITE_URL.endsWith('/')?process.env.SITE_URL:process.env.SITE_URL+'/';
              const response=await page.goto(new URL('mr-caveat.html',base).toString());
              if(!response||!response.ok())throw Error('Mr. Caveat HTTP failure');
              await page.getByRole('button',{name:/Cause a problem/}).waitFor();
              const start=await page.screenshot();fs.writeFileSync('mr-caveat-live-start.png',start);
              if(variance(start)<40)throw Error('Mr. Caveat title lacks visual detail');
              await page.getByRole('button',{name:/Cause a problem/}).click();
              const bg=await page.locator('#world').evaluate(el=>getComputedStyle(el).backgroundImage);
              if(!bg.includes('moon-market.svg'))throw Error('Live Moon Market scene did not load');
              const gameplay=await page.screenshot();fs.writeFileSync('mr-caveat-live-gameplay.png',gameplay);
              if(variance(gameplay)<40)throw Error('Mr. Caveat gameplay lacks visual detail');
              await page.evaluate(()=>window.__mrCaveatTest.teleport(37));
              await page.getByRole('button',{name:/Look closer/}).click();
              await page.getByRole('button',{name:/That complicates things/}).click();
              await page.evaluate(()=>window.__mrCaveatTest.teleport(37));
              await page.getByRole('button',{name:/Accuse Sauce Face/}).click();
              await page.getByRole('button',{name:/Run\./}).click();
              await page.evaluate(()=>window.__mrCaveatTest.finishRunner());
              await page.getByRole('button',{name:/Maybe find a better clue/}).click();
              await page.evaluate(()=>window.__mrCaveatTest.teleport(47));
              await page.getByRole('button',{name:/Inspect tiny flour print/}).click();
              await page.getByRole('button',{name:/Follow it/}).click();
              await page.evaluate(()=>window.__mrCaveatTest.teleport(91));
              await page.getByRole('button',{name:/check the bridge roof/i}).click();
              await page.getByRole('button',{name:/GO\./}).click();
              await page.evaluate(()=>window.__mrCaveatTest.finishRunner());
              await page.getByText(/Of course it was the cat/i).waitFor();
              const end=await page.screenshot();fs.writeFileSync('mr-caveat-live-end.png',end);
              if(Buffer.compare(start,end)===0)throw Error('Mr. Caveat did not visibly change');
              if(errors.length)throw Error(errors.join('\n'));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mr-caveat-live-visuals
          path: mr-caveat-live-*.png

  visual-moon-2d:
    name: live Moon Garden 2D QA
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Play live Moon Garden
        run: |
          node <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            try{
              const page=await browser.newPage({...devices['iPhone 13']});
              const base=process.env.SITE_URL.endsWith('/')?process.env.SITE_URL:process.env.SITE_URL+'/';
              await page.goto(base);
              await page.getByText('Find a useful clue').waitFor();
              await page.getByRole('button',{name:/Listen for Miso/}).click();
              await page.getByRole('button',{name:/Keep going/}).click();
              await page.getByRole('button',{name:/Follow the bell/}).click();
              await page.getByText('Commitment reopened',{exact:true}).waitFor();
              await page.getByRole('button',{name:/Revise the plan/}).click();
              await page.getByRole('button',{name:/still-warm cushion/}).click();
              await page.getByRole('button',{name:/Keep going/}).click();
              await page.getByRole('button',{name:/Search behind the tea pavilion/}).click();
              await page.getByRole('button',{name:/See what happens/}).click();
              await page.getByText('There you are.').waitFor();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

  visual-moon-3d:
    name: live Moon Garden 3D QA
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Play live Moon Garden 3D
        run: |
          node <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            try{
              const page=await browser.newPage({...devices['iPhone 13']});
              const base=process.env.SITE_URL.endsWith('/')?process.env.SITE_URL:process.env.SITE_URL+'/';
              await page.goto(new URL('moon-garden-3d.html',base).toString());
              await page.getByText('Find a useful clue').waitFor();
              await page.waitForFunction(()=>window.__caveat3dIdle?.()===true);
              await page.getByRole('button',{name:/Listen for Miso/}).click();
              await page.getByRole('button',{name:/Keep going/}).click();
              await page.getByRole('button',{name:/Follow the bell/}).click();
              await page.getByText('Commitment reopened',{exact:true}).waitFor();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

  visual-door:
    name: live legacy Door QA
    needs: [deploy, candidate]
    if: needs.candidate.outputs.legacy_door == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock playwright@1.55.0 pngjs@7
      - run: npx playwright install --with-deps webkit
      - name: Smoke-test live Door 3D
        run: |
          node <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            try{
              const page=await browser.newPage({...devices['iPhone 13']});
              const base=process.env.SITE_URL.endsWith('/')?process.env.SITE_URL:process.env.SITE_URL+'/';
              const response=await page.goto(new URL('3d.html',base).toString());
              if(!response||!response.ok())throw Error('Door HTTP failure');
              await page.getByText('Emergency alarm. Leave this floor.').waitFor();
              await page.getByRole('button',{name:/Inspect latch/}).click();
              await page.waitForFunction(()=>window.__caveatIdle?.());
              await page.getByRole('button',{name:/Push panic bar/}).click();
              await page.waitForFunction(()=>window.__caveatIdle?.());
              await page.getByText(/Door A opened/i).waitFor();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
