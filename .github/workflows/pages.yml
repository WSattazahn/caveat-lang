name: deploy-door
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.104-${{ runner.os }}
      - run: cargo fmt --manifest-path runtime/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path runtime/Cargo.toml --all-targets
      - run: cargo build --manifest-path runtime/Cargo.toml --lib --target wasm32-unknown-unknown --release
      - run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - name: Build static site including CAVEAT 3D
        run: |
          rm -rf dist && mkdir -p dist/pkg
          wasm-bindgen runtime/target/wasm32-unknown-unknown/release/caveat_runtime.wasm --out-dir dist/pkg --target web
          cp web/index.html web/graphics.html web/3d.html web/the_door_round2.cav dist/
          test -s dist/index.html && test -s dist/graphics.html && test -s dist/3d.html
          test -s dist/pkg/caveat_runtime.js && test -s dist/pkg/caveat_runtime_bg.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Verify CAVEAT 3D on iPhone WebKit
        run: |
          node <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{let b=await webkit.launch();try{let p=await b.newPage({...devices['iPhone 13']});let base=process.env.SITE_URL.endsWith('/')?process.env.SITE_URL:process.env.SITE_URL+'/';let errors=[];p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});let r=await p.goto(new URL('3d.html',base));if(!r||!r.ok())throw Error('3D page HTTP failure');await p.getByText('The Door',{exact:true}).waitFor();await p.getByText('Attention 3',{exact:false}).waitFor();let canvas=await p.locator('canvas#c').boundingBox();if(!canvas||canvas.width<100||canvas.height<100)throw Error('3D canvas not rendered');let buttons=await p.locator('#choices button').count();if(buttons<2)throw Error('CAVEAT 3D choices missing');let world=await p.evaluate(()=>({w:document.querySelector('#c').width,h:document.querySelector('#c').height}));if(!world.w||!world.h)throw Error('WebGL canvas has no backing buffer');if(errors.length)throw Error(errors.join('\n'));console.log('Verified CAVEAT 3D HTTPS + WebGL + WASM on iPhone WebKit.');}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
