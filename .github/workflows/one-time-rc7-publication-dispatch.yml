name: one-time rc7 publication record dispatch
on:
  push:
    branches: [codex/dispatch-rc7-publication-record]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Read-only registry gate before dispatching existing finalization
        run: node scripts/record-rc7-publication.mjs --check-only
      - name: Dispatch main publication documentation workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/WSattazahn/caveat-lang/actions/workflows/record-rc7-publication.yml/dispatches -f ref=main
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc7-dispatch-independent-receipts
          path: test-results/
          retention-days: 90
