name: inspect one-time rc7 publication record
on:
  push:
    branches: [codex/dispatch-rc7-publication-record]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 11234894115
          run-id: 37026797517
          github-token: ${{ github.token }}
          path: receipts
      - name: Print retained public error and prepared PR only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['rc7-publication-record.stderr.txt', 'prepared-pr.json']:
              paths=list(Path('receipts').rglob(name))
              if len(paths)!=1: raise RuntimeError('Expected one '+name)
              print(name)
              print(paths[0].read_text())
          PY
