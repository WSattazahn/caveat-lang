name: webkit-stress

# Temporary: counts the intermittent WebKit trap in webreactivesession_new
# under several engine settings. Removed before the fix merges.

on:
  push:
    branches: [claude/project-thread-khrnp6]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustc --version
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.104-${{ runner.os }}
      - run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: stress-runtime
          path: dist/pkg-reactive
          retention-days: 3

  stress:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: no-loop-osr, env: 'JSC_useWasmIPIntLoopOSR=0', args: '--pages 400 --replays 0' }
          - { name: no-prologue-osr, env: 'JSC_useWasmIPIntPrologueOSR=0', args: '--pages 400 --replays 0' }
          - { name: no-epilogue-osr, env: 'JSC_useWasmIPIntEpilogueOSR=0', args: '--pages 400 --replays 0' }
          - { name: verbose-osr, env: 'JSC_verboseOSR=1', args: '--pages 400 --replays 0' }
        shard: [1, 2, 3]
    name: stress / ${{ matrix.config.name }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: stress-runtime
          path: stress-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - if: matrix.config.instrument
        run: node bench/carmack/instrument-glue.mjs stress-runtime stress-runtime-i && rm -rf stress-runtime && mv stress-runtime-i stress-runtime
      - name: Stress
        shell: bash
        run: env ${{ matrix.config.env }} node bench/carmack/webkit-stress.mjs --runtime stress-runtime ${{ matrix.config.args }}
