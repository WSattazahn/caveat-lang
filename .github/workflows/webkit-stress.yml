name: webkit-stress

# Temporary: counts the intermittent WebKit trap in webreactivesession_new
# under several engine settings. Removed before the fix merges.

on:
  push:
    branches: [claude/project-thread-khrnp6]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustc --version
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.104-${{ runner.os }}
      - run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: stress-runtime
          path: dist/pkg-reactive
          retention-days: 3

  stress:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: default, env: '' }
          - { name: no-omg, env: 'JSC_useOMGJIT=0' }
          - { name: no-bbq, env: 'JSC_useBBQJIT=0' }
          - { name: no-jit, env: 'JSC_useBBQJIT=0 JSC_useOMGJIT=0' }
          - { name: no-osr, env: 'JSC_useWasmIPIntLoopOSR=0 JSC_useWasmIPIntPrologueOSR=0 JSC_useWasmIPIntEpilogueOSR=0 JSC_useWasmOSR=0' }
          - { name: no-fastmem, env: 'JSC_useWasmFastMemory=0' }
    name: stress / ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: stress-runtime
          path: stress-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Stress
        shell: bash
        run: env ${{ matrix.config.env }} node bench/carmack/webkit-stress.mjs --runtime stress-runtime --pages 80 --replays 4
