name: webkit-stress

# Temporary: counts the intermittent WebKit trap in webreactivesession_new
# under several engine settings. Removed before the fix merges.

on:
  push:
    branches: [claude/project-thread-khrnp6]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustc --version
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.104-${{ runner.os }}
      - run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: stress-runtime
          path: dist/pkg-reactive
          retention-days: 3

  stress:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: default, env: '', args: '--pages 200 --replays 6' }
          - { name: garbage-5, env: '', args: '--pages 150 --replays 0 --garbage 5' }
          - { name: garbage-20, env: '', args: '--pages 150 --replays 0 --garbage 20' }
          - { name: collect-continuously, env: 'JSC_collectContinuously=1', args: '--pages 40 --replays 2' }
          - { name: gc-stress, env: 'JSC_slowPathAllocsBetweenGCs=1000', args: '--pages 40 --replays 2' }
    name: stress / ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: stress-runtime
          path: stress-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Stress
        shell: bash
        run: env ${{ matrix.config.env }} node bench/carmack/webkit-stress.mjs --runtime stress-runtime ${{ matrix.config.args }}
